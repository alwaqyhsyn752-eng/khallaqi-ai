version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: khallaqi-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://khallaqi:khallaqi@postgres:5432/khallaqi
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - khallaqi-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: khallaqi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: khallaqi
      POSTGRES_PASSWORD: khallaqi
      POSTGRES_DB: khallaqi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khallaqi"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - khallaqi-net

  redis:
    image: redis:7-alpine
    container_name: khallaqi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - khallaqi-net

volumes:
  postgres_data:
  redis_data:

networks:
  khallaqi-net:
    driver: bridge
