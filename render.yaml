services:
  - type: web
    name: khallaqi
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: |
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --config gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: westeurope
      - key: AZURE_VOICE_AR
        value: ar-SA-HamedNeural
      - key: RATE_LIMIT_PER_MIN
        value: "20"
      - key: RATE_LIMIT_PER_HOUR
        value: "500"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: khallaqi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: khallaqi-redis
          type: redis
          property: connectionString

  - type: redis
    name: khallaqi-redis
    plan: free
    region: frankfurt
    ipAllowList: []

databases:
  - name: khallaqi-db
    plan: free
    region: frankfurt
    databaseName: khallaqi
    user: khallaqi
