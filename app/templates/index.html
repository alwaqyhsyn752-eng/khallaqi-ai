<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخلاقي — مساعدك الذكي</title>
<meta name="google-site-verification" content="9RjHhUXXbS2oSpykbGA5QXN9JvgUc17S7BP_Ktx1e5c" />
<meta name="description" content="الخلاقي — مساعد ذكاء اصطناعي عربي متخصص في البرمجة والأمن السيبراني.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#020617;--g1:rgba(8,25,45,.55);--g2:rgba(10,35,60,.45);--g3:rgba(15,50,80,.35);--text:#e0f2fe;--soft:#bae6fd;--muted:#7dd3fc;--p:#06b6d4;--p2:#0891b2;--p3:#38bdf8;--pglow:rgba(6,182,212,.55);--ok:#10b981;--bad:#ef4444;--warn:#f59e0b;--bd:rgba(6,182,212,.20);--bd2:rgba(6,182,212,.45);--bd3:rgba(56,189,248,.75);--e:cubic-bezier(.22,1.2,.36,1);--es:cubic-bezier(.4,0,.2,1)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg.aur{background:radial-gradient(ellipse 60% 50% at 15% 10%,rgba(6,182,212,.22),transparent 55%),radial-gradient(ellipse 55% 60% at 85% 90%,rgba(8,145,178,.18),transparent 55%),radial-gradient(ellipse 70% 60% at 50% 50%,rgba(56,189,248,.08),transparent 60%);animation:aur 24s ease-in-out infinite alternate}
@keyframes aur{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-2%,2%) scale(1.08)}}
.bg.gr{background-image:linear-gradient(rgba(6,182,212,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(6,182,212,.045) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,black 20%,transparent 75%)}

.splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000;overflow:hidden;transition:opacity 1.2s var(--es), transform 1.2s var(--es), filter 1.2s}
.splash.leave{opacity:0;transform:scale(1.15);filter:blur(20px);pointer-events:none}
.splash-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;filter:brightness(.55) contrast(1.15) saturate(.9);opacity:0;animation:videoFadeIn 2s ease-out forwards}
@keyframes videoFadeIn{to{opacity:1}}
.splash-vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center, transparent 15%, rgba(2,6,23,.5) 60%, rgba(2,6,23,.98) 100%),linear-gradient(180deg, rgba(2,6,23,.75) 0%, transparent 25%, transparent 75%, rgba(2,6,23,.95) 100%)}
.splash-waves{position:absolute;bottom:0;left:0;right:0;height:35%;z-index:3;pointer-events:none;opacity:.5}
.splash-waves svg{width:100%;height:100%}
.cinematic-content{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px;width:100%;opacity:0;transition:opacity 2s ease-in-out}
.cinematic-content.active{opacity:1}
.cinematic-logo{font-family:'Cairo',sans-serif;font-size:clamp(4rem,16vw,10rem);font-weight:900;letter-spacing:8px;line-height:1;margin:0;background:linear-gradient(180deg, #ffffff 0%, #a5f3fc 35%, #06b6d4 65%, #0891b2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 80px rgba(6,182,212,.85), 0 0 160px rgba(6,182,212,.4);filter:drop-shadow(0 10px 50px rgba(0,0,0,.95));opacity:0}
.cinematic-content.active .cinematic-logo{animation:cinematicReveal 2.5s ease-out forwards}
@keyframes cinematicReveal{0%{opacity:0;transform:scale(.7);filter:blur(30px) drop-shadow(0 0 0 rgba(6,182,212,0))}60%{opacity:1;filter:blur(0) drop-shadow(0 0 60px rgba(6,182,212,.6))}100%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 80px rgba(6,182,212,.9))}}
.cinematic-sub{font-family:'Cairo',sans-serif;font-size:clamp(.95rem,2.8vw,1.5rem);font-weight:700;color:#a5f3fc;letter-spacing:4px;text-shadow:0 0 30px rgba(6,182,212,.9), 0 4px 20px rgba(0,0,0,.95);opacity:0}
.cinematic-content.active .cinematic-sub{animation:fadeInCinematic 2s ease-out 2.5s forwards}
.cinematic-dev{font-family:'Cairo',sans-serif;font-size:clamp(.8rem,2vw,1rem);color:#67e8f9;letter-spacing:3px;text-shadow:0 0 20px rgba(6,182,212,.7);opacity:0}
.cinematic-content.active .cinematic-dev{animation:fadeInCinematic 2s ease-out 3.5s forwards}
@keyframes fadeInCinematic{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.sp-start{position:absolute;bottom:12vh;left:50%;transform:translateX(-50%);z-index:5;padding:18px 60px;font-family:inherit;font-size:1.15rem;font-weight:800;letter-spacing:3px;color:#fff;background:linear-gradient(135deg, #06b6d4, #0891b2);border:none;border-radius:50px;cursor:pointer;box-shadow:0 0 50px rgba(6,182,212,.65), 0 20px 60px rgba(0,0,0,.7), inset 0 0 25px rgba(255,255,255,.18);opacity:0;animation:fadeInCinematic 1.5s ease-out 6s forwards, btnFloat 3s ease-in-out 7.5s infinite;overflow:hidden;isolation:isolate}
.sp-start::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-120%);animation:btnShine 3.5s ease-in-out 7.5s infinite;pointer-events:none}
@keyframes btnShine{0%,100%{transform:translateX(-120%)}50%{transform:translateX(120%)}}
.sp-start:hover{transform:translateX(-50%) translateY(-4px) scale(1.05);box-shadow:0 0 80px rgba(6,182,212,1), 0 25px 80px rgba(0,0,0,.8), inset 0 0 35px rgba(255,255,255,.25)}
@keyframes btnFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}
.light-rays{position:absolute;top:-50%;left:50%;transform:translateX(-50%);width:60%;height:200%;background:linear-gradient(180deg, rgba(6,182,212,.15) 0%, transparent 60%);filter:blur(60px);z-index:4;animation:raysShift 8s ease-in-out infinite;pointer-events:none}
@keyframes raysShift{0%,100%{transform:translateX(-50%) skewX(0deg);opacity:.4}50%{transform:translateX(-50%) skewX(8deg);opacity:.7}}

.app{position:relative;z-index:1;display:flex;height:100vh;width:100vw;opacity:0;pointer-events:none;transition:opacity .9s var(--es) .3s}
.app.vis{opacity:1;pointer-events:auto}
.sb{width:300px;flex-shrink:0;background:linear-gradient(180deg,rgba(2,6,23,.85),rgba(10,25,41,.75));backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border-left:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .4s var(--es);z-index:60}
.sb-h{padding:22px 20px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.br{display:flex;align-items:center;gap:12px}
.br-m{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--p),var(--p2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;box-shadow:0 0 24px var(--pglow)}
.br-i h1{font-size:1.05rem;font-weight:800;background:linear-gradient(135deg,#e0f2fe,var(--p3));-webkit-background-clip:text;background-clip:text;color:transparent}
.br-i p{font-size:.7rem;color:var(--muted);margin-top:2px}
.sb-x{background:transparent;border:1px solid var(--bd);color:var(--soft);width:34px;height:34px;border-radius:10px;cursor:pointer;display:none;align-items:center;justify-content:center}
.newc{margin:16px 14px;padding:14px 18px;border:none;border-radius:16px;font-family:inherit;font-size:.95rem;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 0 24px rgba(6,182,212,.4);display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .3s var(--e)}
.newc:hover{transform:translateY(-2px);box-shadow:0 0 36px rgba(6,182,212,.7)}
.chats{flex:1;overflow-y:auto;padding:0 10px 12px}
.chats::-webkit-scrollbar{width:6px}
.chats::-webkit-scrollbar-thumb{background:rgba(6,182,212,.3);border-radius:3px}
.chats-empty{text-align:center;color:var(--muted);font-size:.8rem;padding:32px 16px}
.ci{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:4px;border-radius:12px;border:1px solid transparent;color:var(--soft);cursor:pointer;font-size:.86rem;transition:all .25s var(--es)}
.ci:hover{background:var(--g2);border-color:var(--bd);color:var(--text)}
.ci.on{background:var(--g2);border-color:var(--bd2);color:var(--text)}
.ci .ic{width:20px;text-align:center;color:var(--p3);font-size:.85rem}
.ci .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .x{background:transparent;border:none;color:var(--muted);width:28px;height:28px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.ci .x:hover{background:var(--bad);color:#fff}
.provs{padding:14px 18px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:8px;font-size:.74rem;color:var(--muted)}
.provs .r{display:flex;justify-content:space-between;align-items:center}
.sdot{width:8px;height:8px;border-radius:50%;background:#3d4455;transition:all .3s}
.sdot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.sdot.warn{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.sbf{padding:12px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:6px}
.sbf button{width:100%;padding:11px 14px;background:var(--g2);color:var(--soft);border:1px solid var(--bd);border-radius:12px;cursor:pointer;font-family:inherit;font-size:.82rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .25s var(--es)}
.sbf button:hover{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.tbar{padding:14px 22px;background:linear-gradient(180deg,rgba(10,25,41,.75),rgba(10,25,41,.45));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;z-index:30;transition:padding .35s var(--es),min-height .35s var(--es);min-height:70px}
.tbar-l{display:flex;align-items:center;gap:14px}
.mbtn{display:none;background:var(--g2);border:1px solid var(--bd);color:var(--text);width:40px;height:40px;border-radius:12px;cursor:pointer;font-size:1rem;align-items:center;justify-content:center}
.mbtn:hover{background:var(--p);border-color:transparent}
.pg-t{font-size:1.02rem;font-weight:800;transition:font-size .3s}
.pg-t span{background:linear-gradient(135deg,#e0f2fe,var(--p3));-webkit-background-clip:text;background-clip:text;color:transparent}
.pg-s{font-size:.7rem;color:var(--muted);margin-top:2px;transition:all .3s}
.tbar-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--g2);border:1px solid var(--bd);border-radius:50px;font-size:.76rem;color:var(--soft);cursor:pointer;font-family:inherit;transition:all .25s var(--es);user-select:none}
.pill:hover{border-color:var(--bd2);color:var(--text)}
.pill.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent;box-shadow:0 0 24px rgba(6,182,212,.6)}
.pill.live{background:linear-gradient(135deg,var(--bad),#dc2626);color:#fff;border-color:transparent;animation:livePulse 1.6s infinite}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}50%{box-shadow:0 0 0 14px rgba(239,68,68,0)}}
.sbar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--g2);border:1px solid var(--bd);border-radius:50px;font-size:.72rem;color:var(--muted)}
.ldot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:db 2s infinite}
@keyframes db{0%,100%{opacity:1}50%{opacity:.45}}
.quick{padding:10px 18px;background:rgba(10,25,41,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;transition:max-height .4s var(--es),padding .4s var(--es),opacity .3s;max-height:80px;opacity:1}
.quick::-webkit-scrollbar{display:none}
.quick button{padding:8px 16px;background:var(--g2);color:var(--soft);border:1px solid var(--bd);border-radius:50px;cursor:pointer;font-size:.77rem;font-family:inherit;white-space:nowrap;transition:all .3s var(--es);display:flex;align-items:center;gap:8px;flex-shrink:0}
.quick button:hover{background:linear-gradient(135deg,rgba(6,182,212,.25),rgba(8,145,178,.25));border-color:var(--bd2);color:var(--text)}
body.cmode .tbar{padding:8px 22px;min-height:52px}
body.cmode .pg-t{font-size:.9rem}
body.cmode .pg-s{display:none}
body.cmode .quick{max-height:0;padding:0 18px;opacity:0;pointer-events:none;overflow:hidden}
body.cmode .tbar-r .pill span{display:none}
body.cmode .tbar-r .sbar span:last-child{display:none}
.chat{flex:1;overflow-y:auto;padding:26px 22px 20px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
body.cmode .chat{padding:22px 18px 16px}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:rgba(6,182,212,.28);border-radius:4px}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:40px 20px}
.wl-logo{font-size:clamp(2.2rem,7vw,3.4rem);font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#e0f2fe 0%,var(--p3) 40%,var(--p) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(6,182,212,.5))}
.welcome p{color:var(--muted);max-width:520px;line-height:1.9;font-size:.98rem}
.wl-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
.wl-chips button{padding:12px 20px;background:var(--g2);color:var(--soft);border:1px solid var(--bd);border-radius:16px;cursor:pointer;font-family:inherit;font-size:.85rem;display:flex;align-items:center;gap:10px;transition:all .3s var(--es)}
.wl-chips button:hover{background:linear-gradient(135deg,rgba(6,182,212,.28),rgba(8,145,178,.28));border-color:var(--bd3);color:#fff;transform:translateY(-3px)}
.msg{max-width:82%;padding:16px 20px;border-radius:20px;line-height:1.75;word-wrap:break-word;position:relative;animation:mIn .55s var(--e);font-size:.94rem}
@keyframes mIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-bottom-left-radius:6px;box-shadow:0 8px 30px rgba(6,182,212,.35)}
.msg.bot{align-self:flex-start;background:var(--g1);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--bd);border-bottom-right-radius:6px;color:var(--text)}
.msg.error{align-self:center;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.5);color:#fca5a5;font-size:.88rem;text-align:center;max-width:90%}
.msg.info{align-self:center;background:rgba(6,182,212,.1);border:1px solid var(--bd2);color:var(--p3);font-size:.82rem;text-align:center;padding:10px 20px}
.sender{font-weight:800;font-size:.74rem;margin-bottom:8px;display:flex;align-items:center;gap:8px;opacity:.85}
.sender .av{width:22px;height:22px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#fff}
.msg.user .sender .av{background:rgba(255,255,255,.25)}
.msg.bot .sender .av{background:linear-gradient(135deg,var(--p),var(--p2))}
.content{white-space:pre-wrap;word-wrap:break-word}
.content img.attached{max-width:100%;border-radius:14px;margin:10px 0;border:1px solid var(--bd);display:block}
pre{background:rgba(2,6,23,.85);border:1px solid rgba(6,182,212,.28);border-radius:14px;padding:46px 18px 18px 18px;margin:12px 0;overflow-x:auto;direction:ltr;text-align:left;font-family:'Consolas',monospace;font-size:.84rem;line-height:1.6;position:relative;white-space:pre}
pre code{display:block;white-space:pre;color:#bae6fd}
.ic{background:rgba(2,6,23,.7);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;font-family:monospace;font-size:.85em;color:var(--p3);direction:ltr;display:inline-block}
.cbtn{position:absolute;top:6px;right:10px;padding:6px 14px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:none;border-radius:9px;cursor:pointer;font-family:inherit;font-size:.72rem;font-weight:700;display:flex;align-items:center;gap:6px;z-index:2}
.cbtn.done{background:var(--ok)}
.src{font-size:.66rem;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px dashed rgba(6,182,212,.18);display:flex;align-items:center;gap:6px;opacity:.85}
.scursor{display:inline-block;width:8px;height:18px;background:var(--p);vertical-align:middle;margin-right:5px;animation:cblink .85s infinite;border-radius:2px}
@keyframes cblink{0%,100%{opacity:1}50%{opacity:0}}
.typing{align-self:flex-start;padding:16px 22px;background:var(--g1);backdrop-filter:blur(22px);border:1px solid var(--bd);border-radius:20px;display:flex;gap:7px}
.typing span{width:9px;height:9px;border-radius:50%;background:var(--p);animation:tDot 1.3s infinite}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes tDot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-9px);opacity:1}}
.iwrap{background:linear-gradient(180deg,rgba(10,25,41,.35),rgba(10,25,41,.85));backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid var(--bd);padding:16px 22px 18px;transition:padding .3s var(--es)}
body.cmode .iwrap{padding:12px 18px 14px}
.iinner{max-width:1080px;margin:0 auto;position:relative}
.prev{display:none;padding:12px 16px;background:var(--g2);border:1px solid var(--bd);border-radius:16px;align-items:center;gap:14px;margin-bottom:12px}
.prev.show{display:flex}
.prev img{max-width:64px;max-height:64px;border-radius:12px;border:1px solid var(--bd);object-fit:cover}
.prev .inf{flex:1;font-size:.82rem;color:var(--muted)}
.prev .rm{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.4);border-radius:10px;padding:8px 14px;cursor:pointer;font-family:inherit;font-size:.78rem;display:flex;align-items:center;gap:6px}
.prev .rm:hover{background:var(--bad);color:#fff}
.vpill{display:none;padding:10px 20px;background:linear-gradient(135deg,rgba(6,182,212,.25),rgba(8,145,178,.25));border:1px solid var(--bd3);border-radius:50px;color:var(--p3);font-size:.82rem;font-weight:600;align-items:center;gap:14px;margin-bottom:12px;width:fit-content}
.vpill.show{display:flex}
.vwave{display:flex;gap:3px;align-items:center;height:20px}
.vwave span{width:3px;background:var(--p3);border-radius:2px;animation:wv 1.1s infinite ease-in-out}
.vwave span:nth-child(1){animation-delay:0s;height:8px}
.vwave span:nth-child(2){animation-delay:.1s;height:16px}
.vwave span:nth-child(3){animation-delay:.2s;height:11px}
.vwave span:nth-child(4){animation-delay:.3s;height:18px}
.vwave span:nth-child(5){animation-delay:.4s;height:10px}
@keyframes wv{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.ibox{background:var(--g1);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);border:1px solid var(--bd);border-radius:26px;padding:12px 18px 10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 60px rgba(0,0,0,.4);transition:border-color .35s,box-shadow .35s}
.ibox:focus-within{border-color:var(--bd2);box-shadow:0 20px 60px rgba(0,0,0,.4),0 0 40px rgba(6,182,212,.28)}
textarea{width:100%;min-height:44px;max-height:360px;background:transparent;border:none;outline:none;resize:none;color:var(--text);font-family:inherit;font-size:1rem;line-height:1.75;padding:8px 4px;transition:min-height .35s var(--es)}
textarea::placeholder{color:var(--muted);opacity:.7}
textarea:focus,textarea:not(:placeholder-shown){min-height:130px}
body.cmode textarea:focus{min-height:150px}
@media(max-width:640px){textarea{font-size:.95rem}textarea:focus,textarea:not(:placeholder-shown){min-height:110px}}

<script>
/* ═══════════════════════════════════════════════════════
   KhlaqiTTS — وحدة الصوت الاحترافية
   ═══════════════════════════════════════════════════════ */
const KhlaqiTTS = (() => {
    const CONFIG = {
        backendUrl: "",
        autoplay: false,
        language: "ar-SA",
        fallbackRate: 1.0,
        fallbackPitch: 1.0,
        volume: 1.0
    };

    let currentAudio = null;
    let currentObjectUrl = null;
    let currentButton = null;
    let isPlaying = false;
    let isLoading = false;

    function getArabicVoice() {
        if (!("speechSynthesis" in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        if (!voices || voices.length === 0) return null;
        const saudi = voices.find(v => v.lang && v.lang.toLowerCase() === "ar-sa");
        if (saudi) return saudi;
        const arabic = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ar"));
        return arabic || null;
    }

    function speakWithWebSpeech(text) {
        return new Promise((resolve, reject) => {
            try {
                if (!("speechSynthesis" in window)) {
                    reject(new Error("Web Speech not supported"));
                    return;
                }
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = CONFIG.language;
                u.rate = CONFIG.fallbackRate;
                u.pitch = CONFIG.fallbackPitch;
                u.volume = CONFIG.volume;
                const voice = getArabicVoice();
                if (voice) u.voice = voice;
                u.onstart = () => { isPlaying = true; updateButtonState(currentButton, "playing"); };
                u.onend = () => { isPlaying = false; updateButtonState(currentButton, "idle"); resolve(); };
                u.onerror = (e) => { isPlaying = false; updateButtonState(currentButton, "idle"); reject(new Error(e.error || "Web Speech error")); };
                window.speechSynthesis.speak(u);
            } catch (e) { reject(e); }
        });
    }

    function stop() {
        try {
            if ("speechSynthesis" in window) window.speechSynthesis.cancel();
            if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; currentAudio.src = ""; }
            if (currentObjectUrl) { URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
        } catch (e) { console.error("TTS stop error:", e); }
        isPlaying = false;
        isLoading = false;
        updateButtonState(currentButton, "idle");
        currentAudio = null;
        currentButton = null;
    }

    async function requestBackendTTS(text) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 25000);
        try {
            const url = (CONFIG.backendUrl || "") + "/api/v1/tts";
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text }),
                signal: controller.signal
            });
            if (!response.ok) throw new Error("TTS backend error " + response.status);
            const ct = response.headers.get("content-type") || "";
            if (!ct.includes("audio")) throw new Error("Backend returned non-audio");
            return await response.blob();
        } finally { clearTimeout(timer); }
    }

    async function playBlob(blob) {
        const objectUrl = URL.createObjectURL(blob);
        currentObjectUrl = objectUrl;
        const audio = new Audio(objectUrl);
        currentAudio = audio;
        audio.preload = "auto";
        audio.volume = CONFIG.volume;
        return new Promise((resolve, reject) => {
            audio.onplay = () => { isPlaying = true; updateButtonState(currentButton, "playing"); };
            audio.onended = () => {
                isPlaying = false;
                updateButtonState(currentButton, "idle");
                URL.revokeObjectURL(objectUrl);
                currentObjectUrl = null;
                currentAudio = null;
                resolve();
            };
            audio.onerror = () => {
                isPlaying = false;
                updateButtonState(currentButton, "idle");
                reject(new Error("Audio playback failed"));
            };
            audio.play().catch(reject);
        });
    }

    async function speak(text, button = null) {
        if (!text || !text.trim()) return;
        currentButton = button;
        if (isPlaying || isLoading) { stop(); return; }
        updateButtonState(button, "loading");
        isLoading = true;
        try {
            const blob = await requestBackendTTS(text);
            isLoading = false;
            await playBlob(blob);
            return;
        } catch (e) { console.warn("Backend TTS failed:", e); }
        try {
            isLoading = false;
            await speakWithWebSpeech(text);
        } catch (e) {
            console.error("Web Speech failed:", e);
            isLoading = false;
            updateButtonState(button, "idle");
        }
    }

    const ICONS = {
        idle: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>',
        playing: '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
        loading: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-opacity="0.25"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>'
    };

    function updateButtonState(button, state) {
        if (!button) return;
        button.dataset.ttsState = state;
        button.innerHTML = ICONS[state] || ICONS.idle;
        if (state === "playing") {
            button.title = "إيقاف الصوت";
            button.classList.add("tts-playing");
            button.classList.remove("tts-loading");
        } else if (state === "loading") {
            button.title = "جاري إنشاء الصوت";
            button.classList.add("tts-loading");
            button.classList.remove("tts-playing");
        } else {
            button.title = "تشغيل الصوت";
            button.classList.remove("tts-playing", "tts-loading");
        }
    }

    function createButton(text) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "khlaqi-tts-button";
        button.innerHTML = ICONS.idle;
        button.title = "تشغيل الصوت";
        button.setAttribute("aria-label", "تشغيل الرد صوتياً");
        button.addEventListener("click", async () => {
            try { await speak(text, button); }
            catch (e) { console.error(e); updateButtonState(button, "idle"); }
        });
        return button;
    }

    async function speakWhenResponseArrives(text) {
        if (!CONFIG.autoplay) return;
        try { await speak(text, null); }
        catch (e) { console.error("Autoplay TTS failed:", e); }
    }

    return {
        speak, stop, createButton, speakWhenResponseArrives,
        setBackendUrl(url) { CONFIG.backendUrl = String(url).replace(/\/$/, ""); },
        setAutoplay(value) { CONFIG.autoplay = Boolean(value); },
        isPlaying() { return isPlaying; }
    };
})();

function generateOceanSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = 2 * ctx.sampleRate;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.3;
    const source = ctx.createBufferSource();
    source.buffer = buffer; source.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 400;
    const gain = ctx.createGain(); gain.gain.value = 0.25;
    source.connect(filter).connect(gain).connect(ctx.destination);
    source.start();
  } catch (e) {}
}

function generateSharkSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(80, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + 1.5);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 250;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 0.15);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 2);
    osc.connect(filter).connect(gain).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 2);
  } catch (e) {}
}

async function api(path,opt={}){

  if(opt.body&&typeof opt.body==='string'&&!opt.headers['Content-Type'])opt.headers['Content-Type']='application/json';

function initRecog(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  const r=new SR();
  r.lang='ar-SA';r.continuous=false;r.interimResults=true;
  r.onresult=e=>{
    let it='',fi='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal)fi+=t;else it+=t;
    }
    inputEl.value=fi||it;
    if(fi){vstatus.textContent='تم الالتقاط...';setTimeout(()=>{if(!isSending)sendMsg();},500);}
  };
  r.onerror=e=>{
    if(e.error==='not-allowed')toast('يجب السماح بالميكروفون','error');
    else if(e.error==='no-speech')toast('لم يتم التقاط صوت','info');
    stopVoice();
  };
  r.onend=()=>stopVoice();
  return r;
}

/* ═══ Render ═══ */
function renderContent(el,text){
  const parts=String(text).split('```');
  for(let i=0;i<parts.length;i++){
    if(i%2===0){
      const sub=parts[i].split('`');
      sub.forEach((sp,j)=>{
        if(j%2===0){if(sp)el.appendChild(document.createTextNode(sp));}
        else{
          const c=document.createElement('span');
          c.className='ic';
          c.textContent=sp;
          el.appendChild(c);
        }
      });
    }else{
      const pre=document.createElement('pre');
      const codeText=parts[i].replace(/^[a-zA-Z0-9_+\-#\.]*\n/,'');
      const cd=document.createElement('code');
      cd.textContent=codeText;
      pre.appendChild(cd);
      const b=document.createElement('button');
      b.className='cbtn';b.type='button';
      b.innerHTML='<i class="fa-regular fa-copy"></i> نسخ';
      b.onclick=()=>{
        navigator.clipboard.writeText(codeText).then(()=>{
          b.innerHTML='<i class="fa-solid fa-check"></i> تم';
          b.classList.add('done');
          setTimeout(()=>{b.innerHTML='<i class="fa-regular fa-copy"></i> نسخ';b.classList.remove('done');},1600);
        }).catch(()=>toast('فشل النسخ','error'));
      };
      pre.appendChild(b);
      el.appendChild(pre);
    }
  }
}

/* ═══ addMsg — يستخدم KhlaqiTTS ═══ */
function addMsg(text,role,source,save=true,type='text',media=null){
  if(chatEl.querySelector('.welcome'))chatEl.innerHTML='';
  const msg=document.createElement('div');
  msg.className='msg '+role;
  if(role!=='error'&&role!=='info'){
    const s=document.createElement('div');
    s.className='sender';
    const av=document.createElement('span');
    av.className='av';
    av.innerHTML=role==='user'?'<i class="fa-solid fa-user"></i>':'<i class="fa-solid fa-bolt"></i>';
    s.appendChild(av);
    const lb=document.createElement('span');
    lb.textContent=role==='user'?'أنت':'الخلاقي';
    s.appendChild(lb);
    msg.appendChild(s);
  }
  if(type==='image'&&media){
    const im=document.createElement('img');
    im.className='attached';
    im.src=media.startsWith('data:')?media:'data:image/jpeg;base64,'+media;
    msg.appendChild(im);
  }
  const ct=document.createElement('div');
  ct.className='content';
  if(role==='error'||role==='info')ct.textContent=text;
  else renderContent(ct,text);
  msg.appendChild(ct);
  if(source&&role==='bot'){
    const s=document.createElement('div');
    s.className='src';
    s.innerHTML='<i class="fa-solid fa-satellite-dish"></i> '+source;
    msg.appendChild(s);
  }
  // 🔊 زر الصوت الاحترافي
  if(role==='bot'&&text&&!String(text).startsWith('❌')){
    const ttsButton = KhlaqiTTS.createButton(text);
    msg.appendChild(ttsButton);
  }
  chatEl.appendChild(msg);
  chatEl.scrollTop=chatEl.scrollHeight;
  if(role==='bot'&&ttsOn&&text&&!String(text).startsWith('❌'))speakTxt(text);
  if(save&&currentChatId){
    pushMsg(currentChatId,{role,content:text,source,type,media});
    if(role==='user'){
      const ch=chats.find(c=>c.id===currentChatId);
      if(ch){
        const msgs=loadMsgs(currentChatId);
        if(msgs.length===1){
          ch.title=String(text).slice(0,40)||'محادثة';
          ch.updated_at=new Date().toISOString();
          saveChats();
          renderChats();
        }
      }
    }
  }
  return msg;
}

  const reply='أنا الخلاقي في الوضع التجريبي.\n\nاستلمت: "'+text.slice(0,80)+'"\n\nلتفعيل الردود الحقيقية شغّل الخادم.\n\nمثال:\n```python\nprint("Hello")\n```';
  addMsg(reply,'bot','demo');
  isSending=false;
  inputEl.focus();
}

async function sendImg(text){
  const im=selImg,tp=selImgType;

  inputEl.value='';inputEl.style.height='auto';

      await new Promise(r=>setTimeout(r,900));

      addMsg('الوضع التجريبي.','bot','demo');

      const d=await api(API+'/chat',{method:'POST',body:JSON.stringify({message:text,chat_id:currentChatId,user_id:USER_ID,image:im,image_type:tp,system_prompt:SYSTEM_PROMPT})});
      hideTyping();

  finally{isSending=false;sBtn.disabled=false;sLbl.textContent='إرسال';inputEl.focus();}
}

async function sendStream(text){
  addMsg(text,'user');
  inputEl.value='';inputEl.style.height='auto';
  sLbl.textContent='إيقاف';
  sBtn.classList.add('stop');
  $('activeProv').textContent='يفكر...';
  if(chatEl.querySelector('.welcome'))chatEl.innerHTML='';
  const bd=document.createElement('div');
  bd.className='msg bot';
  const sn=document.createElement('div');
  sn.className='sender';
  sn.innerHTML='<span class="av"><i class="fa-solid fa-bolt"></i></span><span>الخلاقي</span>';
  bd.appendChild(sn);
  const cd=document.createElement('div');
  cd.className='content';
  bd.appendChild(cd);
  const cu=document.createElement('span');
  cu.className='scursor';
  cd.appendChild(cu);
  chatEl.appendChild(bd);
  chatEl.scrollTop=chatEl.scrollHeight;
  let full='';let src=null;
  try{
    abort=new AbortController();
    const r=await fetch(API+'/chat/stream',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-User-ID':USER_ID},
      body:JSON.stringify({message:text,chat_id:currentChatId,user_id:USER_ID,system_prompt:SYSTEM_PROMPT}),
      signal:abort.signal
    });
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rd=r.body.getReader();
    const dc=new TextDecoder();
    let buf='';
    while(true){
      const{done,value}=await rd.read();
      if(done)break;
      buf+=dc.decode(value,{stream:true});
      const lines=buf.split('\n\n');
      buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith('data: '))continue;
        let ev;
        try{ev=JSON.parse(line.substring(6));}catch(e){continue;}
        if(ev.provider){src=ev.provider;$('activeProv').textContent=ev.provider;}
        else if(ev.chunk){
          full+=ev.chunk;
          cu.remove();
          cd.textContent=full;
          cd.appendChild(cu);
          chatEl.scrollTop=chatEl.scrollHeight;
        }else if(ev.done){
          cu.remove();
          cd.innerHTML='';
          renderContent(cd,full);
          if(src){
            const s=document.createElement('div');
            s.className='src';
            s.innerHTML='<i class="fa-solid fa-satellite-dish"></i> '+src;
            bd.appendChild(s);
          }
          // 🔊 زر الصوت الاحترافي
          const ttsButton = KhlaqiTTS.createButton(full);
          bd.appendChild(ttsButton);
          if(ttsOn&&full)speakTxt(full);
          $('activeProv').textContent=src||'جاهز';
          if(currentChatId){
            pushMsg(currentChatId,{role:'bot',content:full,source:src,type:'text',media:null});
          }
          loadAllChats();
        }else if(ev.error){
          cu.remove();
          cd.textContent=ev.error;
          bd.className='msg error';
          $('activeProv').textContent='فشل';
        }
      }
    }
  }catch(e){
    cu.remove();
    if(e.name==='AbortError'){
      cd.innerHTML='';
      renderContent(cd,full+'\n\n[تم الإيقاف]');
      if(currentChatId&&full){
        pushMsg(currentChatId,{role:'bot',content:full+'\n\n[تم الإيقاف]',source:src,type:'text',media:null});
      }
    }else{
      bd.className='msg error';
      cd.textContent=e.message;
    }
  }finally{
    abort=null;
    isSending=false;
    sBtn.disabled=false;
    sLbl.textContent='إرسال';
    sBtn.classList.remove('stop');
    inputEl.focus();
  }
}

inputEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.shiftKey||e.ctrlKey||e.metaKey)){e.preventDefault();sendMsg();}
});
inputEl.addEventListener('input',()=>{
  inputEl.style.height='auto';
  inputEl.style.height=Math.min(inputEl.scrollHeight,360)+'px';
});

}

/* ═══ Init ═══ */
async function initApp(){
  await detect();
  if(DEMO){$('activeProv').textContent='تجريبي';}
  else{
    try{
      const d=await api(API+'/status');
      const p=d.providers||{},f=d.features||{};
      azureOk=!!f.voice_tts_azure;
      setDot('dotGem',p.gemini);
      setDot('dotGroq',p.groq);
      setDot('dotOR',p.openrouter);
      setDot('dotVenice',p.venice);
      setDot('dotAbl',p.abliteration);
      setDot('dotUnfil',p.unfil);
    }catch(e){}
  }
  await loadAllChats();
  const saved=localStorage.getItem(LS.CUR);
  let target=null;
  if(saved&&chats.find(c=>c.id===saved))target=saved;
  else if(chats.length>0)target=chats[0].id;
  if(target){
    const hasM=loadMsgs(target).length>0;
    if(hasM)await openChat(target);
    else if(DEMO||!REACHABLE){
      currentChatId=target;
      localStorage.setItem(LS.CUR,target);
      showWelcome();
      unCmode();
    }else await openChat(target);
  }else await newChat();
  setTimeout(()=>inputEl.focus(),400);
}
