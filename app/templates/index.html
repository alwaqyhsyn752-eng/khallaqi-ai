<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخلاقي — مساعد ذكي عربي للبرمجة والأمن</title>
<meta name="google-site-verification" content="9RjHhUXXbS2oSpykbGA5QXN9JvgUc17S7BP_Ktx1e5c" />
<meta name="description" content="الخلاقي — مساعد ذكاء اصطناعي عربي متخصص في البرمجة والأمن السيبراني. مجاني وسريع ويحترم خصوصيتك.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060c;
  --bg2:#0a0d18;
  --surface:rgba(19,24,38,.72);
  --surface2:rgba(26,33,56,.65);
  --text:#eef1ff;
  --muted:#8b95a9;
  --accent:#a855f7;
  --accent2:#7c3aed;
  --accent3:#c084fc;
  --glow:0 0 24px rgba(168,85,247,.55);
  --glow-soft:0 0 40px rgba(168,85,247,.28);
  --success:#10b981;
  --danger:#ef4444;
  --warning:#f59e0b;
  --border:rgba(168,85,247,.18);
  --border2:rgba(168,85,247,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden}
body{
  font-family:'Cairo',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(168,85,247,.18), transparent 45%),
    radial-gradient(ellipse at 80% 90%, rgba(124,58,237,.15), transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(192,132,252,.06), transparent 60%);
  z-index:-2;
  animation:bgShift 20s ease-in-out infinite;
}
body::after{
  content:"";
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(168,85,247,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168,85,247,.03) 1px, transparent 1px);
  background-size:60px 60px;
  z-index:-1;
  mask-image:radial-gradient(ellipse at center, black, transparent 80%);
}
@keyframes bgShift{
  0%,100%{transform:scale(1) translate(0,0)}
  50%{transform:scale(1.15) translate(2%,-2%)}
}

/* ═══════════════════════════════════════════
   Splash / Landing Screen
   ═══════════════════════════════════════════ */
#splash{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:40px;
  z-index:1000;
  background:radial-gradient(ellipse at center, #0a0d18 0%, #05060c 100%);
  transition:opacity .9s ease, transform .9s ease;
}
#splash.hide{opacity:0;transform:scale(1.08);pointer-events:none}

.splash-particles{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;
}
.splash-particles span{
  position:absolute;
  width:4px;height:4px;
  background:var(--accent3);
  border-radius:50%;
  box-shadow:0 0 12px var(--accent3), 0 0 24px rgba(192,132,252,.6);
  animation:floatUp linear infinite;
  opacity:0;
}
@keyframes floatUp{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-100px) scale(1.3);opacity:0}
}

.splash-logo{
  position:relative;
  display:flex;
  gap:12px;
  font-size:5rem;
  font-weight:800;
  letter-spacing:4px;
  text-align:center;
  direction:rtl;
}
@media(max-width:600px){.splash-logo{font-size:3rem;gap:6px}}

.splash-logo .letter{
  display:inline-block;
  color:transparent;
  background:linear-gradient(135deg, #e9d5ff 0%, #a855f7 50%, #7c3aed 100%);
  -webkit-background-clip:text;
  background-clip:text;
  text-shadow:0 0 30px rgba(168,85,247,.6);
  opacity:0;
  filter:blur(20px);
  transform:translate(var(--tx), var(--ty)) scale(.3) rotate(var(--rot));
  animation:letterAssemble 1.6s cubic-bezier(.22,1.6,.36,1) forwards;
  animation-delay:var(--delay);
}
@keyframes letterAssemble{
  0%{
    opacity:0;
    filter:blur(20px);
    transform:translate(var(--tx), var(--ty)) scale(.3) rotate(var(--rot));
  }
  60%{
    opacity:1;
    filter:blur(0);
  }
  100%{
    opacity:1;
    filter:blur(0);
    transform:translate(0,0) scale(1) rotate(0);
    text-shadow:0 0 20px rgba(192,132,252,.9), 0 0 40px rgba(168,85,247,.7);
  }
}

.splash-sub{
  font-size:1rem;
  color:var(--muted);
  letter-spacing:2px;
  opacity:0;
  animation:fadeIn 1s ease 1.6s forwards;
}
.splash-dev{
  font-size:.85rem;
  color:var(--accent3);
  opacity:0;
  animation:fadeIn 1s ease 1.9s forwards;
}
@keyframes fadeIn{to{opacity:1}}

.splash-ring{
  position:absolute;
  width:400px;height:400px;
  border-radius:50%;
  border:1px solid rgba(168,85,247,.2);
  animation:pulseRing 3s ease-in-out infinite;
  pointer-events:none;
}
.splash-ring:nth-child(2){width:520px;height:520px;animation-delay:.5s;border-color:rgba(168,85,247,.1)}
.splash-ring:nth-child(3){width:640px;height:640px;animation-delay:1s;border-color:rgba(168,85,247,.05)}
@keyframes pulseRing{
  0%,100%{transform:scale(1);opacity:.6}
  50%{transform:scale(1.05);opacity:1}
}
@media(max-width:600px){.splash-ring{width:260px;height:260px}.splash-ring:nth-child(2){width:340px;height:340px}.splash-ring:nth-child(3){width:420px;height:420px}}

.start-btn{
  position:relative;
  margin-top:20px;
  padding:16px 42px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  border:none;
  border-radius:50px;
  font-family:inherit;
  font-size:1.05rem;
  font-weight:700;
  cursor:pointer;
  letter-spacing:1px;
  box-shadow:var(--glow), inset 0 0 20px rgba(255,255,255,.15);
  opacity:0;
  animation:fadeIn .8s ease 2.2s forwards, glowPulse 2.5s ease-in-out 2.2s infinite;
  overflow:hidden;
  transition:transform .3s, box-shadow .3s;
}
.start-btn:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 0 40px rgba(168,85,247,.8), 0 0 80px rgba(168,85,247,.4), inset 0 0 30px rgba(255,255,255,.25)}
.start-btn::before{
  content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  animation:shine 3s ease-in-out infinite;
}
@keyframes shine{0%,100%{left:-100%}50%{left:100%}}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 24px rgba(168,85,247,.55), inset 0 0 20px rgba(255,255,255,.15)}
  50%{box-shadow:0 0 40px rgba(168,85,247,.85), 0 0 70px rgba(168,85,247,.4), inset 0 0 25px rgba(255,255,255,.25)}
}

/* ═══════════════════════════════════════════
   Main App
   ═══════════════════════════════════════════ */
.app{
  display:flex;height:100vh;width:100vw;
  opacity:0;pointer-events:none;
  transition:opacity .6s ease;
}
.app.show{opacity:1;pointer-events:auto}

/* Sidebar */
.sidebar{
  width:290px;
  background:rgba(10,13,24,.85);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  z-index:50;
}
@media(max-width:800px){
  .sidebar{position:fixed;right:0;top:0;bottom:0;transform:translateX(100%);width:85%;max-width:320px}
  .sidebar.open{transform:translateX(0)}
}
.sb-head{
  padding:20px 18px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.sb-logo{
  font-size:1.25rem;font-weight:800;
  background:linear-gradient(135deg,#e9d5ff,var(--accent));
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  text-shadow:0 0 20px rgba(168,85,247,.4);
}
.sb-sub{font-size:.7rem;color:var(--muted);margin-top:3px}

.new-chat{
  margin:14px 12px;
  padding:14px 18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;border-radius:14px;
  font-family:inherit;font-size:.95rem;font-weight:700;
  cursor:pointer;
  box-shadow:0 0 18px rgba(168,85,247,.35);
  transition:all .3s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  position:relative;overflow:hidden;
}
.new-chat:hover{box-shadow:0 0 30px rgba(168,85,247,.65);transform:translateY(-2px)}
.new-chat::before{
  content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
  animation:shine 4s ease-in-out infinite;
}

.chats-list{flex:1;overflow-y:auto;padding:0 10px 10px;scrollbar-width:thin}
.chats-list::-webkit-scrollbar{width:6px}
.chats-list::-webkit-scrollbar-thumb{background:rgba(168,85,247,.3);border-radius:3px}

.chat-item{
  padding:12px 14px;
  background:transparent;color:var(--text);
  border:1px solid transparent;
  border-radius:12px;cursor:pointer;
  margin-bottom:6px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:.85rem;
  font-family:inherit;
  transition:all .2s;
}
.chat-item:hover{background:var(--surface2);border-color:var(--border)}
.chat-item.active{background:var(--surface2);border-color:var(--accent);box-shadow:0 0 12px rgba(168,85,247,.25)}
.chat-item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:8px}
.chat-item .del{
  padding:4px 7px;border-radius:6px;font-size:.75rem;color:var(--muted);
  background:transparent;border:none;cursor:pointer;transition:all .2s;
}
.chat-item .del:hover{background:var(--danger);color:#fff}

.providers{
  padding:12px 16px;
  border-top:1px solid var(--border);
  font-size:.72rem;color:var(--muted);
}
.providers .row{display:flex;justify-content:space-between;padding:3px 0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;transition:all .3s}
.dot.ok{background:var(--success);box-shadow:0 0 8px var(--success)}
.dot.no{background:#4a5568}

.sb-foot{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.sb-foot button{
  width:100%;padding:10px;
  background:var(--surface2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;
  cursor:pointer;font-size:.8rem;font-family:inherit;
  transition:all .2s;
}
.sb-foot button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}

.top-bar{
  background:rgba(19,24,38,.75);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  padding:14px 20px;
  border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;flex-wrap:wrap;
  z-index:20;
}
.hl{display:flex;align-items:center;gap:12px}
.menu-btn{
  display:none;
  background:transparent;border:1px solid var(--border);
  color:var(--text);padding:8px 12px;border-radius:10px;
  cursor:pointer;font-size:1.1rem;
}
@media(max-width:800px){.menu-btn{display:flex}}
.page-title{font-size:1.05rem;font-weight:700}
.page-title span{background:linear-gradient(135deg,#e9d5ff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.page-sub{font-size:.72rem;color:var(--muted);margin-top:2px}

.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.pill{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:50px;
  font-size:.75rem;color:var(--muted);
  cursor:pointer;user-select:none;
  font-family:inherit;
  transition:all .25s;
}
.pill:hover{border-color:var(--border2);color:var(--text)}
.pill.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border-color:transparent;
  box-shadow:0 0 16px rgba(168,85,247,.5);
}
.pill.live{
  background:linear-gradient(135deg,var(--danger),#dc2626);
  color:#fff;border-color:transparent;
  animation:livePulse 1.5s infinite;
}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}50%{box-shadow:0 0 0 10px rgba(239,68,68,0)}}

.badge-pill{
  padding:7px 14px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:50px;
  font-size:.7rem;color:var(--muted);
  display:flex;align-items:center;gap:8px;
}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:dotPulse 2s infinite}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.5}}

/* Quick chips */
.quick{
  padding:10px 16px;
  background:rgba(10,13,24,.6);
  border-bottom:1px solid var(--border);
  display:flex;gap:8px;overflow-x:auto;
  scrollbar-width:none;
}
.quick::-webkit-scrollbar{display:none}
.quick button{
  padding:8px 14px;
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:50px;
  cursor:pointer;
  font-size:.78rem;
  font-family:inherit;
  white-space:nowrap;
  transition:all .2s;
}
.quick button:hover{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 0 16px rgba(168,85,247,.5)}

/* Chat */
.chat{
  flex:1;
  overflow-y:auto;
  padding:24px 20px;
  display:flex;flex-direction:column;gap:16px;
  scroll-behavior:smooth;
  scrollbar-width:thin;
}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:rgba(168,85,247,.25);border-radius:4px}
.chat::-webkit-scrollbar-thumb:hover{background:rgba(168,85,247,.5)}

.msg{
  max-width:82%;
  padding:14px 18px;
  border-radius:18px;
  line-height:1.75;
  word-wrap:break-word;
  position:relative;
  animation:msgIn .4s cubic-bezier(.2,1.2,.4,1);
  box-shadow:0 4px 20px rgba(0,0,0,.2);
}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg.user{
  align-self:flex-end;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  border-bottom-left-radius:4px;
  box-shadow:0 4px 24px rgba(168,85,247,.35);
}
.msg.bot{
  align-self:flex-start;
  background:var(--surface);
  border:1px solid var(--border);
  border-bottom-right-radius:4px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.msg.bot::before{
  content:"";
  position:absolute;inset:-1px;
  border-radius:18px;
  background:linear-gradient(135deg,rgba(168,85,247,.3),transparent 60%);
  z-index:-1;
  opacity:.5;
}
.msg.error{
  align-self:center;
  background:rgba(239,68,68,.15);
  border:1px solid var(--danger);
  color:#fca5a5;
  font-size:.85rem;
  text-align:center;
  max-width:90%;
}
.msg.info{
  align-self:center;
  background:rgba(59,130,246,.15);
  border:1px solid #3b82f6;
  color:#93c5fd;
  font-size:.8rem;
  text-align:center;
  padding:10px 18px;
}
.sender{
  font-weight:700;
  font-size:.72rem;
  opacity:.85;
  margin-bottom:6px;
  display:flex;align-items:center;gap:6px;
}
.content{white-space:pre-wrap;word-wrap:break-word}
.content p{margin:6px 0}
.content img.attached{max-width:100%;border-radius:12px;margin:10px 0;border:1px solid var(--border);display:block}

pre{
  background:#05060c;
  border:1px solid rgba(168,85,247,.3);
  border-radius:12px;
  padding:16px;
  padding-top:42px;
  margin:10px 0;
  overflow-x:auto;
  direction:ltr;
  text-align:left;
  font-family:'Cascadia Code','Fira Code',Consolas,monospace;
  font-size:.85rem;
  position:relative;
  white-space:pre;
  box-shadow:inset 0 0 30px rgba(168,85,247,.08);
}
pre::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:32px;
  background:rgba(168,85,247,.08);
  border-bottom:1px solid rgba(168,85,247,.15);
  border-radius:12px 12px 0 0;
}
.inline-code{
  background:#05060c;
  border:1px solid var(--border);
  border-radius:6px;
  padding:2px 8px;
  font-family:monospace;
  font-size:.88em;
  color:var(--accent3);
}
.copy-btn{
  position:absolute;
  top:6px;right:8px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;
  border:none;
  border-radius:8px;
  padding:6px 14px;
  cursor:pointer;
  font-size:.72rem;
  font-family:inherit;
  font-weight:600;
  box-shadow:0 2px 12px rgba(168,85,247,.4);
  transition:all .2s;
  z-index:2;
}
.copy-btn:hover{box-shadow:0 2px 20px rgba(168,85,247,.8)}
.copy-btn.done{background:var(--success)}

.source-badge{
  font-size:.65rem;
  color:var(--muted);
  margin-top:8px;
  padding-top:8px;
  border-top:1px dashed var(--border);
  opacity:.75;
}
.speak-btn{
  position:absolute;
  top:10px;left:10px;
  background:var(--surface2);
  color:var(--muted);
  border:1px solid var(--border);
  border-radius:50%;
  width:32px;height:32px;
  cursor:pointer;
  font-size:.85rem;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
  z-index:2;
}
.speak-btn:hover{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 0 16px rgba(168,85,247,.6)}

.streaming-cursor{
  display:inline-block;
  width:8px;height:18px;
  background:var(--accent);
  animation:blink .8s infinite;
  vertical-align:middle;
  margin-right:4px;
  box-shadow:0 0 12px var(--accent);
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Empty state */
.empty{
  flex:1;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:20px;text-align:center;
  padding:40px 20px;
}
.empty-logo{
  font-size:2.8rem;
  font-weight:800;
  letter-spacing:2px;
  background:linear-gradient(135deg,#e9d5ff,var(--accent) 50%,var(--accent2));
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  text-shadow:0 0 40px rgba(168,85,247,.5);
}
.empty p{color:var(--muted);max-width:500px;line-height:1.8;font-size:.95rem}
.empty .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.empty .chips button{
  padding:12px 18px;
  background:var(--surface2);
  color:var(--text);
  border:1px solid var(--border);
  border-radius:14px;
  cursor:pointer;
  font-family:inherit;
  font-size:.85rem;
  transition:all .25s;
}
.empty .chips button:hover{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(168,85,247,.4);
}

/* Input Area - Modern */
.input-wrap{
  background:rgba(10,13,24,.75);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-top:1px solid var(--border);
  padding:16px 20px 20px;
}
.input-inner{max-width:1000px;margin:0 auto}

.preview-box{
  display:none;
  padding:10px 14px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:14px;
  align-items:center;gap:14px;
  margin-bottom:10px;
}
.preview-box.show{display:flex}
.preview-box img{max-width:70px;max-height:70px;border-radius:10px;border:1px solid var(--border)}
.preview-box .info{flex:1;font-size:.82rem;color:var(--muted)}
.preview-box .rm{
  background:var(--danger);color:#fff;border:none;
  border-radius:8px;padding:8px 14px;cursor:pointer;
  font-size:.8rem;font-family:inherit;
}

.voice-pill{
  display:none;
  padding:10px 16px;
  background:linear-gradient(135deg,rgba(168,85,247,.25),rgba(124,58,237,.25));
  border:1px solid var(--accent);
  border-radius:50px;
  color:var(--accent3);
  font-size:.82rem;
  align-items:center;gap:12px;
  margin-bottom:10px;

<script>
// ═══════════════════════════════════════════════════════
// Splash particles
// ═══════════════════════════════════════════════════════
(function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('span');
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (3 + Math.random() * 4) + 's';
    p.style.animationDelay = (Math.random() * 4) + 's';
    p.style.opacity = (0.4 + Math.random() * 0.6);
    container.appendChild(p);
  }
})();

// ═══════════════════════════════════════════════════════
// Start app — play sound, hide splash, show app
// ═══════════════════════════════════════════════════════
function playStartSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.1);
      gain.gain.linearRampToValueAtTime(0.15, ctx.currentTime + i * 0.1 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * 0.1);
      osc.stop(ctx.currentTime + i * 0.1 + 0.4);
    });
  } catch(e) { console.warn('Audio not available', e); }
}

function startApp() {
  playStartSound();
  const splash = document.getElementById('splash');
  splash.classList.add('hide');
  setTimeout(() => {
    splash.style.display = 'none';
    document.getElementById('app').classList.add('show');
  }, 900);
}

// ═══════════════════════════════════════════════════════
// General state
// ═══════════════════════════════════════════════════════
const API_BASE = '/api/v1';

let USER_ID = localStorage.getItem('khallaqi_user_id');
if (!USER_ID) {
  USER_ID = 'u_' + Math.random().toString(36).slice(2) + Date.now();
  localStorage.setItem('khallaqi_user_id', USER_ID);
}

let currentChatId = null;
let chats = [];
let isSending = false;
let selectedImage = null;
let selectedImageType = 'image/jpeg';
let streamAbort = null;

let ttsEnabled = localStorage.getItem('khallaqi_tts') === 'true';
let liveMode = false;
let isRecording = false;
let isSpeaking = false;
let recognition = null;
let currentAudio = null;
let azureAvailable = false;

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const micBtn = document.getElementById('micBtn');
const fileInput = document.getElementById('fileInput');
const previewBox = document.getElementById('previewBox');
const previewImg = document.getElementById('previewImg');
const ttsToggle = document.getElementById('ttsToggle');
const liveModeBtn = document.getElementById('liveModeBtn');
const voiceIndicator = document.getElementById('voiceIndicator');
const voiceStatusText = document.getElementById('voiceStatusText');

// ═══════════════════════════════════════════════════════
// API helper
// ═══════════════════════════════════════════════════════
async function api(path, options = {}) {
  options.headers = options.headers || {};
  if (!options.headers['X-User-ID']) options.headers['X-User-ID'] = USER_ID;
  if (options.body && typeof options.body === 'string' && !options.headers['Content-Type']) {
    options.headers['Content-Type'] = 'application/json';
  }
  const r = await fetch(path, options);
  const raw = await r.text();
  let data;
  try { data = raw ? JSON.parse(raw) : {}; }
  catch(e) { throw new Error('رد غير متوقع من السيرفر'); }
  if (!r.ok) {
    const err = new Error(data.error || data.message || 'خطأ في الطلب');
    err.status = r.status;
    throw err;
  }
  return data;
}

// ═══════════════════════════════════════════════════════
// Voice config (Saudi young)
// ═══════════════════════════════════════════════════════
const VOICE_CONFIG = {
  lang: 'ar-SA',
  pitch: 1.08,
  rate: 1.0,
  volume: 1.0,
  preferKeywords: ['hamed','hameed','حامد','male','رجل','majed','ماجد','naayf','shakir'],
};

function updateTtsUI() { ttsToggle.classList.toggle('active', ttsEnabled); }
function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  localStorage.setItem('khallaqi_tts', ttsEnabled ? 'true' : 'false');
  updateTtsUI();
  if (ttsEnabled) speakText('تم تفعيل النطق');
  else stopSpeaking();
}
updateTtsUI();

function pickArabicMaleVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || !voices.length) return null;
  let v = voices.find(x => {
    const n = x.name.toLowerCase(), l = x.lang.toLowerCase();
    return (l.startsWith('ar-sa') || l.includes('sa')) &&
           VOICE_CONFIG.preferKeywords.some(k => n.includes(k.toLowerCase()));
  });
  if (v) return v;
  v = voices.find(x => {
    const n = x.name.toLowerCase(), l = x.lang.toLowerCase();
    return l.startsWith('ar') && VOICE_CONFIG.preferKeywords.some(k => n.includes(k.toLowerCase()));
  });
  if (v) return v;
  return voices.find(x => x.lang.toLowerCase().startsWith('ar-sa')) ||
         voices.find(x => x.lang.toLowerCase().startsWith('ar')) || null;
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

async function speakText(text) {
  if (!text) return;
  stopSpeaking();
  if (azureAvailable) {
    try {
      const blob = await fetchAzureTTS(text);
      if (blob) { await playAudioBlob(blob); return; }
    } catch(e) {}
  }
  speakWebSpeech(text);
}

async function fetchAzureTTS(text) {
  try {
    const r = await fetch(API_BASE + '/tts', {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-User-ID': USER_ID},
      body: JSON.stringify({text}),
    });
    if ((r.headers.get('content-type') || '').includes('audio')) return await r.blob();
    return null;
  } catch(e) { return null; }
}

function playAudioBlob(blob) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    isSpeaking = true;
    micBtn.classList.add('speaking');
    const done = () => {
      isSpeaking = false;
      micBtn.classList.remove('speaking');
      URL.revokeObjectURL(url);
      currentAudio = null;
      resolve(); onSpeechEnd();
    };
    audio.onended = done;
    audio.onerror = done;
    audio.play().catch(() => done());
  });
}

function speakWebSpeech(text) {
  if (!('speechSynthesis' in window)) return;
  let clean = text.replace(/```[\s\S]*?```/g, ' كود ').replace(/`([^`]+)`/g,'$1').replace(/[#*_]/g,'').substring(0,500);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = VOICE_CONFIG.lang;
  u.pitch = VOICE_CONFIG.pitch;
  u.rate = VOICE_CONFIG.rate;
  u.volume = VOICE_CONFIG.volume;
  const v = pickArabicMaleVoice();
  if (v) u.voice = v;
  u.onstart = () => { isSpeaking = true; micBtn.classList.add('speaking'); };
  u.onend = () => { isSpeaking = false; micBtn.classList.remove('speaking'); onSpeechEnd(); };
  u.onerror = () => { isSpeaking = false; micBtn.classList.remove('speaking'); onSpeechEnd(); };
  window.speechSynthesis.speak(u);
}

function stopSpeaking() {
  if (currentAudio) { try { currentAudio.pause(); currentAudio = null; } catch(e){} }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  isSpeaking = false;
  micBtn.classList.remove('speaking');
}

function onSpeechEnd() {
  if (liveMode && !isRecording) setTimeout(() => { if (liveMode && !isSending) startVoice(); }, 400);
}

// ═══════════════════════════════════════════════════════
// Speech-to-text
// ═══════════════════════════════════════════════════════
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'ar-SA';
  r.continuous = false;
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onresult = e => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t;
      else interim += t;
    }
    inputEl.value = final || interim;
    if (final) {
      voiceStatusText.textContent = 'تم الالتقاط...';
      setTimeout(() => { if (!isSending) sendMsg(); }, 500);
    }
  };
  r.onerror = e => {
    if (e.error === 'not-allowed') showError('❌ يجب السماح بالميكروفون');
    else if (e.error === 'no-speech') showInfo('لم يتم التقاط صوت');
    stopVoice();
  };
  r.onend = () => stopVoice();
  return r;
}
function toggleVoice() { isRecording ? stopVoice() : startVoice(); }
function startVoice() {
  if (isSpeaking) { stopSpeaking(); return; }
  if (!recognition) recognition = initRecognition();
  if (!recognition) { showError('❌ المتصفح لا يدعم الصوت'); return; }
  try {
    recognition.start();
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.textContent = '⏹️';
    voiceIndicator.classList.add('show');
    voiceStatusText.textContent = 'جاري الاستماع...';
  } catch(e) {}
}
function stopVoice() {
  if (recognition && isRecording) { try { recognition.stop(); } catch(e){} }
  isRecording = false;
  micBtn.classList.remove('recording');
  micBtn.textContent = '🎤';
  voiceIndicator.classList.remove('show');
}
function toggleLiveMode() {
  liveMode = !liveMode;
  if (liveMode) {
    liveModeBtn.classList.add('live');
    ttsEnabled = true;
    localStorage.setItem('khallaqi_tts', 'true');
    updateTtsUI();
    showInfo('🎙️ المحادثة الحية مفعّلة');
    startVoice();
  } else {
    liveModeBtn.classList.remove('live');
    stopVoice();
    stopSpeaking();
    showInfo('تم إيقاف المحادثة الحية');
  }
}

// ═══════════════════════════════════════════════════════
// Image
// ═══════════════════════════════════════════════════════
function pickImage() { fileInput.click(); }
function handleFileSelect(e) {
  const f = e.target.files[0];
  if (!f) return;
  if (!f.type.startsWith('image/')) { showError('❌ اختر صورة'); return; }
  if (f.size > 10 * 1024 * 1024) { showError('❌ الصورة كبيرة (الحد 10MB)'); return; }
  selectedImageType = f.type;
  const reader = new FileReader();
  reader.onload = ev => {
    selectedImage = ev.target.result;
    previewImg.src = selectedImage;
    document.getElementById('previewInfo').textContent = `صورة جاهزة (${(f.size/1024).toFixed(1)} KB)`;
    previewBox.classList.add('show');
  };
  reader.readAsDataURL(f);
  fileInput.value = '';
}
function removeImage() {
  selectedImage = null;
  previewImg.src = '';
  previewBox.classList.remove('show');
}

// Video

function openVideoModal() { document.getElementById('videoModal').classList.add('show'); }
function closeVideoModal() { document.getElementById('videoModal').classList.remove('show'); }
async function generateVideo() {
  const prompt = document.getElementById('videoPrompt').value.trim();
  if (!prompt) { showError('❌ الوصف مطلوب'); return; }
  if (!currentChatId) await newChat();
  closeVideoModal();
  addMsg('🎬 طلب فيديو: ' + prompt, 'user');
  showTyping();
  try {
    const d = await api(API_BASE + '/generate-video', {
      method: 'POST',
      body: JSON.stringify({prompt, chat_id: currentChatId, user_id: USER_ID}),
    });
    hideTyping();
    if (d.error) { addMsg('❌ ' + d.error, 'error'); return; }
    addMsg('🎬 تم بدء التوليد: ' + d.operation, 'bot', d.model);
    pollVideoStatus(d.operation);
  } catch(e) { hideTyping(); addMsg('❌ ' + e.message, 'error'); }
}
async function pollVideoStatus(op, n = 0) {
  if (n > 60) { showInfo('⏱️ الفيديو يستغرق وقتاً'); return; }
  setTimeout(async () => {
    try {
      const d = await api(API_BASE + '/video-status', {method:'POST', body: JSON.stringify({operation: op})});
      if (d.done && d.video_url) addMsg('✅ تم التوليد: <a href="' + d.video_url + '" target="_blank">مشاهدة</a>', 'bot');
      else if (!d.done) pollVideoStatus(op, n + 1);
    } catch(e) { pollVideoStatus(op, n + 1); }
  }, 10000);
}

  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  if (chatEl.querySelector('.empty')) chatEl.innerHTML = '';

// ═══════════════════════════════════════════════════════
// Chats
// ═══════════════════════════════════════════════════════
async function loadChats() {
  try { const d = await api(API_BASE + '/chats'); chats = d.chats || []; renderChats(); }
  catch(e) { console.error(e); }
}
function renderChats() {
  const list = document.getElementById('chatsList');
  if (!chats.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.8rem;padding:24px 12px;">لا توجد محادثات</div>';
    return;
  }
  list.innerHTML = '';
  chats.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
    const t = document.createElement('span'); t.className = 'title';
    t.textContent = '💬 ' + (c.title || 'محادثة');
    btn.appendChild(t);
    const d = document.createElement('button'); d.className = 'del'; d.textContent = '🗑️';
    d.onclick = ev => { ev.stopPropagation(); deleteChat(c.id); };
    btn.appendChild(d);
    btn.onclick = ev => { if (!ev.target.classList.contains('del')) openChat(c.id); };
    list.appendChild(btn);
  });
}
async function newChat() {
  try {
    const d = await api(API_BASE + '/chats/new', {method:'POST', body: JSON.stringify({user_id: USER_ID})});
    if (!d.chat_id) { showError('❌ ' + (d.error || 'فشل')); return; }
    currentChatId = d.chat_id;
    await loadChats();
    showEmpty();
    if (window.innerWidth <= 800) toggleSidebar();
  } catch(e) { showError('❌ ' + e.message); }
}
async function openChat(id) {
  currentChatId = id;
  await loadChats();
  chatEl.innerHTML = '';
  try {
    const d = await api(API_BASE + '/chats/' + id);
    if (d.messages && d.messages.length) {
      d.messages.forEach(m => addMsg(m.content, m.role === 'user' ? 'user' : 'bot', m.source, false, m.type, m.media));
      chatEl.scrollTop = chatEl.scrollHeight;
    } else showEmpty();
  } catch(e) { showError('❌ ' + e.message); }
  if (window.innerWidth <= 800) toggleSidebar();
}
async function deleteChat(id) {
  if (!confirm('حذف المحادثة؟')) return;
  try {
    await api(API_BASE + '/chats/' + id, {method:'DELETE', body: JSON.stringify({user_id: USER_ID})});
    if (currentChatId === id) { currentChatId = null; showEmpty(); }
    await loadChats();
  } catch(e) { showError('❌ ' + e.message); }
}

// ═══════════════════════════════════════════════════════
// Message rendering
// ═══════════════════════════════════════════════════════
function showEmpty() {
  chatEl.innerHTML = `
    <div class="empty">
      <div class="empty-logo">⚡ الخلاقي</div>
      <p>مساعدك الذكي العربي — اكتب كوداً، ارفع صورة، تحدث صوتياً، أو اطلب فيديو.</p>
      <div class="chips">
        <button onclick="quickPrompt('اكتب لعبة ثعبان Python كود كامل')">🐍 لعبة ثعبان</button>
        <button onclick="quickPrompt('اكتب موقع شخصي كامل')">🌐 موقع</button>
        <button onclick="pickImage()">🖼️ ارفع صورة</button>
        <button onclick="toggleLiveMode()">🎙️ محادثة صوتية</button>
      </div>
    </div>`;
}

function renderContent(el, text) {
  const parts = text.split('```');
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) {
      const span = document.createElement('span');
      const sub = parts[i].split('`');
      sub.forEach((sp, j) => {
        if (j % 2 === 0) span.appendChild(document.createTextNode(sp));
        else {
          const c = document.createElement('span');
          c.className = 'inline-code'; c.textContent = sp;
          span.appendChild(c);
        }
      });
      el.appendChild(span);
    } else {
      const pre = document.createElement('pre');
      const codeText = parts[i].replace(/^[a-zA-Z0-9_+\-#]*\n/, '');
      const cn = document.createElement('code');
      cn.textContent = codeText;
      pre.appendChild(cn);
      const btn = document.createElement('button');
      btn.className = 'copy-btn'; btn.textContent = '📋 نسخ';
      btn.onclick = () => {
        navigator.clipboard.writeText(codeText).then(() => {
          btn.textContent = '✓ تم';
          btn.classList.add('done');
          setTimeout(() => { btn.textContent = '📋 نسخ'; btn.classList.remove('done'); }, 1500);
        });
      };
      pre.appendChild(btn);
      el.appendChild(pre);
    }
  }
}

function addMsg(text, who, source, save = true, msgType = 'text', media = null) {
  if (chatEl.querySelector('.empty')) chatEl.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'msg ' + who;

  if (who !== 'error' && who !== 'info') {
    const s = document.createElement('div'); s.className = 'sender';
    s.textContent = who === 'user' ? 'أنت' : '⚡ الخلاقي';
    div.appendChild(s);
  }

  if (msgType === 'image' && media) {
    const img = document.createElement('img');
    img.className = 'attached';
    img.src = media.startsWith('data:') ? media : 'data:image/jpeg;base64,' + media;
    div.appendChild(img);
  }

  const content = document.createElement('div'); content.className = 'content';
  if (who === 'error' || who === 'info') content.textContent = text;
  else renderContent(content, text);
  div.appendChild(content);

  if (source && who === 'bot') {
    const sb = document.createElement('div'); sb.className = 'source-badge';
    sb.textContent = '📡 ' + source;
    div.appendChild(sb);
  }

  if (who === 'bot' && text && !text.startsWith('❌')) {
    const sb = document.createElement('button');
    sb.className = 'speak-btn'; sb.textContent = '🔊';
    sb.onclick = () => speakText(text);
    div.appendChild(sb);
  }

  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;

  if (who === 'bot' && ttsEnabled && text && !text.startsWith('❌')) speakText(text);
  return div;
}

function quickPrompt(t) {
  inputEl.value = t;
  inputEl.focus();
  inputEl.setSelectionRange(t.length, t.length);
}
function showTyping() {
  const d = document.createElement('div');
  d.className = 'typing'; d.id = 'typingIndicator';
  d.innerHTML = '<span></span><span></span><span></span>';
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping() { const e = document.getElementById('typingIndicator'); if (e) e.remove(); }

// ═══════════════════════════════════════════════════════
// Send
// ═══════════════════════════════════════════════════════
async function sendMsg() {
  if (isSending) {
    if (streamAbort) { streamAbort.abort(); streamAbort = null; }
    return;
  }
  const text = inputEl.value.trim();
  if (!text && !selectedImage) return;

  stopSpeaking();
  if (!currentChatId) {
    try {
      const d = await api(API_BASE + '/chats/new', {method:'POST', body: JSON.stringify({user_id: USER_ID})});
      currentChatId = d.chat_id;
      chatEl.innerHTML = '';
      await loadChats();
    } catch(e) { showError('❌ ' + e.message); return; }
  }
  isSending = true;
  if (selectedImage) { await sendWithImage(text); return; }
  await sendWithStream(text);
}

async function sendWithImage(text) {
  addMsg(text || 'حلل هذه الصورة', 'user', null, true, 'image', selectedImage);
  const img = selectedImage, typ = selectedImageType;
  inputEl.value = '';
  sendBtn.disabled = true; sendBtn.textContent = '...';
  showTyping();
  document.getElementById('activeProvider').textContent = 'يفكر...';
  try {
    const d = await api(API_BASE + '/chat', {
      method:'POST',
      body: JSON.stringify({message: text, chat_id: currentChatId, user_id: USER_ID, image: img, image_type: typ}),
    });
    hideTyping();
    if (d.response) { addMsg(d.response, 'bot', d.source); document.getElementById('activeProvider').textContent = d.source || 'جاهز'; loadChats(); }
    else if (d.error) showError('❌ ' + d.error);
    removeImage();
  } catch(e) { hideTyping(); showError('❌ ' + e.message); }
  finally {
    isSending = false; sendBtn.disabled = false; sendBtn.textContent = 'إرسال ➤';
    sendBtn.classList.remove('stopping'); inputEl.focus();
  }
}

async function sendWithStream(text) {
  addMsg(text, 'user');
  inputEl.value = '';
  sendBtn.textContent = '⏹️ إيقاف';
  sendBtn.classList.add('stopping');
  document.getElementById('activeProvider').textContent = 'يفكر...';

  if (chatEl.querySelector('.empty')) chatEl.innerHTML = '';
  const botDiv = document.createElement('div');
  botDiv.className = 'msg bot';
  const sender = document.createElement('div'); sender.className = 'sender'; sender.textContent = '⚡ الخلاقي';
  botDiv.appendChild(sender);
  const contentDiv = document.createElement('div'); contentDiv.className = 'content';
  botDiv.appendChild(contentDiv);
  const cursor = document.createElement('span'); cursor.className = 'streaming-cursor';
  contentDiv.appendChild(cursor);
  chatEl.appendChild(botDiv);
  chatEl.scrollTop = chatEl.scrollHeight;

  let fullText = '', streamSource = null;

  try {
    streamAbort = new AbortController();
    const r = await fetch(API_BASE + '/chat/stream', {
      method: 'POST',
      headers: {'Content-Type':'application/json','X-User-ID': USER_ID},
      body: JSON.stringify({message: text, chat_id: currentChatId, user_id: USER_ID}),
      signal: streamAbort.signal,
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);

    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.substring(6)); } catch(e) { continue; }

        if (evt.provider) {
          streamSource = evt.provider;
          document.getElementById('activeProvider').textContent = evt.provider;
        } else if (evt.chunk) {
          fullText += evt.chunk;
          cursor.remove();
          contentDiv.textContent = fullText;
          contentDiv.appendChild(cursor);
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (evt.done) {
          cursor.remove();
          contentDiv.innerHTML = '';
          renderContent(contentDiv, fullText);
          if (streamSource) {
            const sb = document.createElement('div'); sb.className = 'source-badge';
            sb.textContent = '📡 ' + streamSource;
            botDiv.appendChild(sb);
          }
          const spk = document.createElement('button'); spk.className = 'speak-btn'; spk.textContent = '🔊';
          spk.onclick = () => speakText(fullText);
          botDiv.appendChild(spk);
          if (ttsEnabled && fullText) speakText(fullText);
          document.getElementById('activeProvider').textContent = streamSource || 'جاهز';
          loadChats();
        } else if (evt.error) {
          cursor.remove();
          contentDiv.textContent = '❌ ' + evt.error;
          botDiv.className = 'msg error';
          document.getElementById('activeProvider').textContent = 'فشل';
        }
      }
    }
  } catch(e) {
    cursor.remove();
    if (e.name === 'AbortError') {
      contentDiv.innerHTML = '';
      renderContent(contentDiv, fullText + '\n\n[تم الإيقاف]');
    } else {
      botDiv.className = 'msg error';
      contentDiv.textContent = '❌ ' + e.message;
    }
  } finally {
    streamAbort = null;
    isSending = false;
    sendBtn.disabled = false;
    sendBtn.textContent = 'إرسال ➤';
    sendBtn.classList.remove('stopping');
    inputEl.focus();
  }
}

// ═══════════════════════════════════════════════════════

inputEl.addEventListener('keydown', e => {

});
