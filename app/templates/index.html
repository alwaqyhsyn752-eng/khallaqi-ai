<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخلاقي — مساعدك الذكي</title>
<meta name="google-site-verification" content="9RjHhUXXbS2oSpykbGA5QXN9JvgUc17S7BP_Ktx1e5c" />
<meta name="description" content="الخلاقي — مساعد ذكاء اصطناعي عربي متخصص في البرمجة والأمن السيبراني.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
/* ═══════════════════════════════════════════════════════════
   ROOT VARIABLES
   ═══════════════════════════════════════════════════════════ */
:root{
  --bg-0:#05060c;
  --bg-1:#0a0d18;
  --glass-1:rgba(19,24,38,.55);
  --glass-2:rgba(26,33,56,.45);
  --glass-3:rgba(40,50,80,.35);
  --text:#eef1ff;
  --text-soft:#c8cfe0;
  --muted:#8b95a9;
  --purple:#a855f7;
  --purple-2:#7c3aed;
  --purple-3:#c084fc;
  --purple-glow:rgba(168,85,247,.55);
  --purple-glow-soft:rgba(168,85,247,.25);
  --success:#10b981;
  --danger:#ef4444;
  --warning:#f59e0b;
  --stroke:rgba(168,85,247,.20);
  --stroke-2:rgba(168,85,247,.45);
  --stroke-hot:rgba(192,132,252,.75);
  --radius-sm:12px;
  --radius:18px;
  --radius-lg:26px;
  --ease:cubic-bezier(.22,1.2,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Cairo',system-ui,-apple-system,sans-serif;
  background:var(--bg-0);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  position:relative;
}

/* ═══════════════════════════════════════════════════════════
   AMBIENT ANIMATED BACKGROUND
   ═══════════════════════════════════════════════════════════ */
.bg-layer{position:fixed;inset:0;pointer-events:none;z-index:0}

.bg-layer.aurora{
  background:
    radial-gradient(ellipse 60% 50% at 15% 10%, rgba(168,85,247,.22), transparent 55%),
    radial-gradient(ellipse 55% 60% at 85% 90%, rgba(124,58,237,.18), transparent 55%),
    radial-gradient(ellipse 70% 60% at 50% 50%, rgba(192,132,252,.08), transparent 60%),
    radial-gradient(ellipse 40% 40% at 10% 80%, rgba(168,85,247,.12), transparent 60%),
    radial-gradient(ellipse 40% 40% at 90% 20%, rgba(139,92,246,.14), transparent 60%);
  animation:auroraDrift 24s ease-in-out infinite alternate;
}
@keyframes auroraDrift{
  0%{transform:translate(0,0) scale(1)}
  50%{transform:translate(2%,-2%) scale(1.08)}
  100%{transform:translate(-2%,2%) scale(1.05)}
}

.bg-layer.grid{
  background-image:
    linear-gradient(rgba(168,85,247,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(168,85,247,.045) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center, black 20%, transparent 75%);
  animation:gridFloat 60s linear infinite;
}
@keyframes gridFloat{
  0%{background-position:0 0}
  100%{background-position:64px 64px}
}

.bg-layer.noise::after{
  content:"";position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
  opacity:.035;mix-blend-mode:overlay;
}

/* ═══════════════════════════════════════════════════════════
   SPLASH SCREEN
   ═══════════════════════════════════════════════════════════ */
.splash{
  position:fixed;inset:0;z-index:1000;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:36px;
  background:radial-gradient(ellipse at center, #0a0d18 0%, #05060c 75%);
  transition:opacity .9s var(--ease-soft), transform 1s var(--ease-soft), filter .9s;
  will-change:opacity,transform;
}
.splash.leaving{
  opacity:0;
  transform:scale(1.15);
  filter:blur(18px);
  pointer-events:none;
}

/* Particles: hundreds of tiny dots flying toward center */
.splash-particles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.splash-particles span{
  position:absolute;left:50%;top:50%;
  width:3px;height:3px;border-radius:50%;
  background:var(--purple-3);
  box-shadow:0 0 10px var(--purple-3), 0 0 22px var(--purple-glow);
  opacity:0;
  animation:flyIn 2.4s var(--ease) forwards;
  animation-delay:var(--pd,0s);
  transform-origin:center;
}
@keyframes flyIn{
  0%{
    opacity:0;
    transform:translate(var(--px,0), var(--py,0)) scale(0);
  }
  35%{opacity:1}
  75%{opacity:.9}
  100%{
    opacity:0;
    transform:translate(0,0) scale(2.2);
  }
}

/* Pulsing rings around the logo */
.splash-rings{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.ring{
  position:absolute;border-radius:50%;
  border:1px solid rgba(168,85,247,.22);
  animation:ringPulse 3.6s ease-in-out infinite;
}
.ring:nth-child(1){width:340px;height:340px;animation-delay:0s}
.ring:nth-child(2){width:460px;height:460px;animation-delay:.4s;border-color:rgba(168,85,247,.14)}
.ring:nth-child(3){width:600px;height:600px;animation-delay:.8s;border-color:rgba(168,85,247,.08)}
.ring:nth-child(4){width:760px;height:760px;animation-delay:1.2s;border-color:rgba(168,85,247,.04)}
@keyframes ringPulse{
  0%,100%{transform:scale(1);opacity:.5}
  50%{transform:scale(1.08);opacity:1}
}

/* The logo word */
.splash-logo{
  position:relative;
  display:inline-block;
  font-size:clamp(3rem, 12vw, 6.5rem);
  font-weight:900;
  letter-spacing:2px;
  line-height:1;
  color:transparent;
  background:linear-gradient(135deg, #f3e8ff 0%, #d8b4fe 25%, #a855f7 55%, #7c3aed 100%);
  -webkit-background-clip:text;
  background-clip:text;
  filter:drop-shadow(0 0 22px rgba(168,85,247,.55));
  opacity:0;
  transform:scale(.55) rotate(-6deg);
  animation:logoAssemble 1.9s var(--ease) forwards;
  animation-delay:1s;
  will-change:opacity,transform,filter;
}
@keyframes logoAssemble{
  0%{
    opacity:0;
    transform:scale(.55) rotate(-6deg);
    filter:blur(28px) drop-shadow(0 0 0 rgba(168,85,247,0));
  }
  45%{
    opacity:1;
    filter:blur(0) drop-shadow(0 0 22px rgba(168,85,247,.4));
  }
  70%{
    transform:scale(1.08) rotate(.5deg);
  }
  100%{
    opacity:1;
    transform:scale(1) rotate(0);
    filter:drop-shadow(0 0 22px rgba(168,85,247,.75));
  }
}

.splash-logo::after{
  content:"";
  position:absolute;inset:-20px -30px;
  background:radial-gradient(ellipse at center, rgba(168,85,247,.35), transparent 70%);
  filter:blur(30px);
  z-index:-1;
  animation:auraPulse 3s ease-in-out infinite;
  animation-delay:2.6s;
  opacity:0;
}
@keyframes auraPulse{
  0%{opacity:0;transform:scale(.6)}
  40%{opacity:1;transform:scale(1)}
  100%{opacity:.85;transform:scale(1.05)}
}

/* Shine sweep across the logo */
.splash-logo::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(100deg,
    transparent 30%,
    rgba(255,255,255,.85) 48%,
    rgba(255,255,255,.85) 52%,
    transparent 70%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  mix-blend-mode:screen;
  animation:shineSweep 3.2s ease-in-out infinite;
  animation-delay:2.8s;
  opacity:0;
}
@keyframes shineSweep{
  0%,100%{background-position:-200% 0;opacity:0}
  25%{opacity:1}
  50%{background-position:200% 0;opacity:1}
  75%{opacity:0}
}
.splash-logo::before{background-size:200% 100%}

/* Subtitle & developer line */
.splash-meta{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;transform:translateY(14px);
  animation:fadeUp .9s var(--ease-soft) forwards;
  animation-delay:2.8s;
  text-align:center;
}
.splash-meta .role{
  font-size:1.05rem;font-weight:600;color:var(--purple-3);
  letter-spacing:1px;
  text-shadow:0 0 22px rgba(192,132,252,.6);
}
.splash-meta .dev{
  font-size:.85rem;color:var(--muted);
  letter-spacing:.5px;
}
@keyframes fadeUp{
  to{opacity:1;transform:translateY(0)}
}

/* Start button */
.splash-start{
  position:relative;
  margin-top:8px;
  padding:16px 46px;
  border:none;
  border-radius:50px;
  cursor:pointer;
  font-family:inherit;
  font-size:1.05rem;
  font-weight:800;
  letter-spacing:.5px;
  color:#fff;
  background:linear-gradient(135deg,var(--purple),var(--purple-2));
  box-shadow:
    0 0 24px rgba(168,85,247,.5),
    0 0 60px rgba(168,85,247,.25),
    inset 0 0 24px rgba(255,255,255,.15);
  opacity:0;
  transform:translateY(20px) scale(.9);
  animation:startAppear .9s var(--ease) 3.2s forwards, startPulse 2.6s ease-in-out 4s infinite;
  transition:transform .3s var(--ease), box-shadow .35s, filter .3s;
  overflow:hidden;
  isolation:isolate;
}
.splash-start::before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(115deg,
    transparent 30%,
    rgba(255,255,255,.35) 48%,
    rgba(255,255,255,.35) 52%,
    transparent 70%);
  transform:translateX(-120%);
  animation:btnShine 3.4s ease-in-out 4s infinite;
  pointer-events:none;
}
@keyframes btnShine{
  0%,100%{transform:translateX(-120%)}
  50%{transform:translateX(120%)}
}
.splash-start:hover{
  transform:translateY(-3px) scale(1.05);
  box-shadow:
    0 0 40px rgba(168,85,247,.85),
    0 0 90px rgba(168,85,247,.45),
    inset 0 0 30px rgba(255,255,255,.25);
  filter:brightness(1.08);
}
@keyframes startAppear{
  to{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes startPulse{
  0%,100%{box-shadow:0 0 24px rgba(168,85,247,.5), 0 0 60px rgba(168,85,247,.25), inset 0 0 24px rgba(255,255,255,.15)}
  50%{box-shadow:0 0 40px rgba(168,85,247,.8), 0 0 90px rgba(168,85,247,.4), inset 0 0 30px rgba(255,255,255,.22)}
}

/* ═══════════════════════════════════════════════════════════
   APP LAYOUT
   ═══════════════════════════════════════════════════════════ */
.app{
  position:relative;z-index:1;
  display:flex;height:100vh;width:100vw;
  opacity:0;pointer-events:none;
  transition:opacity .8s var(--ease-soft) .2s;
}
.app.visible{opacity:1;pointer-events:auto}

/* ─── Sidebar ─── */
.sidebar{
  width:300px;flex-shrink:0;
  background:linear-gradient(180deg, rgba(10,13,24,.72), rgba(10,13,24,.55));
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border-left:1px solid var(--stroke);
  display:flex;flex-direction:column;
  transition:transform .4s var(--ease-soft);
  z-index:60;
  position:relative;
}
.sidebar::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg, transparent, var(--purple-3), transparent);
  opacity:.5;
}
.sidebar-head{
  padding:22px 20px;
  border-bottom:1px solid var(--stroke);
  display:flex;justify-content:space-between;align-items:center;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:44px;height:44px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--purple),var(--purple-2));
  box-shadow:0 0 24px rgba(168,85,247,.5), inset 0 0 18px rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:1.2rem;
  position:relative;
  overflow:hidden;
}
.brand-mark::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg, transparent 40%, rgba(255,255,255,.4) 50%, transparent 60%);
  animation:btnShine 4s ease-in-out infinite;
}
.brand-info h1{
  font-size:1.05rem;font-weight:800;letter-spacing:.5px;
  background:linear-gradient(135deg,#f3e8ff,var(--purple-3));
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}
.brand-info p{font-size:.7rem;color:var(--muted);margin-top:2px}
.sidebar-close{
  background:transparent;border:1px solid var(--stroke);
  color:var(--text-soft);width:34px;height:34px;
  border-radius:10px;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  transition:all .25s;
}
.sidebar-close:hover{background:var(--purple);color:#fff;border-color:transparent;box-shadow:0 0 20px var(--purple-glow)}

.new-chat{
  margin:16px 14px;
  padding:14px 18px;
  border:none;border-radius:16px;
  font-family:inherit;font-size:.95rem;font-weight:800;
  color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--purple),var(--purple-2));
  box-shadow:0 0 24px rgba(168,85,247,.4), inset 0 0 18px rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;gap:10px;
  position:relative;overflow:hidden;
  transition:transform .3s var(--ease), box-shadow .3s;
}
.new-chat::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);
  transform:translateX(-120%);
  animation:btnShine 4.5s ease-in-out infinite;
  pointer-events:none;
}
.new-chat:hover{transform:translateY(-2px);box-shadow:0 0 36px rgba(168,85,247,.7), inset 0 0 22px rgba(255,255,255,.22)}
.new-chat i{font-size:1rem}

.chats{
  flex:1;overflow-y:auto;padding:0 10px 12px;
  scrollbar-width:thin;scrollbar-color:rgba(168,85,247,.35) transparent;
}
.chats::-webkit-scrollbar{width:6px}
.chats::-webkit-scrollbar-thumb{background:rgba(168,85,247,.3);border-radius:3px}
.chats::-webkit-scrollbar-thumb:hover{background:rgba(168,85,247,.55)}

.chats-empty{
  text-align:center;color:var(--muted);font-size:.8rem;
  padding:32px 16px;
}

.chat-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  margin-bottom:4px;
  border-radius:12px;
  border:1px solid transparent;
  color:var(--text-soft);
  cursor:pointer;
  font-size:.86rem;
  transition:all .25s var(--ease-soft);
  position:relative;
}
.chat-item:hover{background:var(--glass-2);border-color:var(--stroke);color:var(--text)}
.chat-item.active{
  background:var(--glass-2);
  border-color:var(--stroke-2);
  color:var(--text);
  box-shadow:0 0 22px rgba(168,85,247,.2), inset 0 0 18px rgba(168,85,247,.08);
}
.chat-item.active::before{
  content:"";
  position:absolute;right:0;top:20%;bottom:20%;width:3px;
  background:var(--purple);
  border-radius:3px;
  box-shadow:0 0 14px var(--purple-glow);
}
.chat-item .icon{
  width:20px;text-align:center;
  color:var(--purple-3);
  font-size:.85rem;
  flex-shrink:0;
}
.chat-item .title{
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chat-item .del{
  background:transparent;border:none;color:var(--muted);
  width:28px;height:28px;border-radius:8px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;
  transition:all .2s;
  flex-shrink:0;
}
.chat-item .del:hover{background:var(--danger);color:#fff;box-shadow:0 0 16px rgba(239,68,68,.5)}

/* Provider status */
.providers{
  padding:14px 18px;
  border-top:1px solid var(--stroke);
  display:flex;flex-direction:column;gap:8px;
  font-size:.74rem;
  color:var(--muted);
}
.providers .row{display:flex;justify-content:space-between;align-items:center}
.status-dot{
  width:8px;height:8px;border-radius:50%;
  background:#3d4455;
  transition:all .3s;
}
.status-dot.ok{background:var(--success);box-shadow:0 0 10px var(--success), 0 0 4px var(--success) inset}
.status-dot.no{background:#3d4455}
.status-dot.warn{background:var(--warning);box-shadow:0 0 10px var(--warning)}

.sidebar-foot{
  padding:12px;
  border-top:1px solid var(--stroke);
  display:flex;flex-direction:column;gap:6px;
}
.sidebar-foot button{
  width:100%;padding:11px 14px;
  background:var(--glass-2);
  color:var(--text-soft);
  border:1px solid var(--stroke);
  border-radius:12px;
  cursor:pointer;font-family:inherit;font-size:.82rem;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .25s var(--ease-soft);
}
.sidebar-foot button:hover{
  background:linear-gradient(135deg,var(--purple),var(--purple-2));
  color:#fff;border-color:transparent;
  box-shadow:0 0 24px rgba(168,85,247,.5);
  transform:translateY(-1px);
}

/* ─── Main content ─── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}

/* Top bar */
.topbar{
  padding:14px 22px;
  background:linear-gradient(180deg, rgba(19,24,38,.65), rgba(19,24,38,.35));
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border-bottom:1px solid var(--stroke);
  display:flex;justify-content:space-between;align-items:center;
  gap:12px;flex-wrap:wrap;
  z-index:30;
}
.topbar-left{display:flex;align-items:center;gap:14px}
.menu-btn{
  display:none;
  background:var(--glass-2);border:1px solid var(--stroke);
  color:var(--text);width:40px;height:40px;border-radius:12px;
  cursor:pointer;font-size:1rem;
  align-items:center;justify-content:center;
  transition:all .25s;
}
.menu-btn:hover{background:var(--purple);border-color:transparent;box-shadow:0 0 20px var(--purple-glow)}
.page-title{font-size:1.02rem;font-weight:800}
.page-title span{
  background:linear-gradient(135deg,#f3e8ff,var(--purple-3));
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
}
.page-sub{font-size:.7rem;color:var(--muted);margin-top:2px}

.topbar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.pill{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;
  background:var(--glass-2);
  border:1px solid var(--stroke);
  border-radius:50px;
  font-size:.76rem;color:var(--text-soft);
  cursor:pointer;font-family:inherit;
  transition:all .25s var(--ease-soft);
  user-select:none;
}
.pill:hover{border-color:var(--stroke-2);color:var(--text);background:var(--glass-3)}
.pill i{font-size:.8rem}
.pill.active{
  background:linear-gradient(135deg,var(--purple),var(--purple-2));
  color:#fff;border-color:transparent;
  box-shadow:0 0 24px rgba(168,85,247,.6), inset 0 0 14px rgba(255,255,255,.15);
}
.pill.live{
  background:linear-gradient(135deg,var(--danger),#dc2626);
  color:#fff;border-color:transparent;
  animation:livePulse 1.6s infinite;
}
@keyframes livePulse{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.55), 0 0 24px rgba(239,68,68,.4)}
  50%{box-shadow:0 0 0 14px rgba(239,68,68,0), 0 0 40px rgba(239,68,68,.7)}
}

.status-pill{
  display:flex;align-items:center;gap:8px;
  padding:8px 14px;
  background:var(--glass-2);
  border:1px solid var(--stroke);
  border-radius:50px;
  font-size:.72rem;color:var(--muted);
}
.status-pill .live-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--success);
  box-shadow:0 0 10px var(--success);
  animation:dotBlink 2s infinite;
}
@keyframes dotBlink{0%,100%{opacity:1}50%{opacity:.45}}

/* Quick chips */
.quick{
  padding:10px 18px;
  background:rgba(10,13,24,.4);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--stroke);
  display:flex;gap:8px;overflow-x:auto;
  scrollbar-width:none;
}
.quick::-webkit-scrollbar{display:none}
.quick button{
  padding:8px 16px;
  background:var(--glass-2);
  color:var(--text-soft);
  border:1px solid var(--stroke);
  border-radius:50px;
  cursor:pointer;
  font-size:.77rem;font-family:inherit;
  white-space:nowrap;
  transition:all .3s var(--ease-soft);
  display:flex;align-items:center;gap:8px;
  flex-shrink:0;
}
.quick button i{font-size:.75rem;color:var(--purple-3)}
.quick button:hover{
  background:linear-gradient(135deg,rgba(168,85,247,.25),rgba(124,58,237,.25));
  border-color:var(--stroke-2);
  color:var(--text);
  box-shadow:0 0 22px rgba(168,85,247,.35);
  transform:translateY(-1px);
}

/* ═══════════════════════════════════════════════════════════
   CHAT AREA
   ═══════════════════════════════════════════════════════════ */
.chat{
  flex:1;overflow-y:auto;
  padding:26px 22px 20px;
  display:flex;flex-direction:column;gap:16px;
  scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:rgba(168,85,247,.3) transparent;
  position:relative;
}
.chat::-webkit-scrollbar{width:8px}
.chat::-webkit-scrollbar-thumb{background:rgba(168,85,247,.28);border-radius:4px}
.chat::-webkit-scrollbar-thumb:hover{background:rgba(168,85,247,.55)}

/* Welcome empty state */
.welcome{
  flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;text-align:center;padding:40px 20px;
}
.welcome-logo{
  font-size:clamp(2.2rem,7vw,3.4rem);
  font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#f3e8ff 0%,var(--purple-3) 40%,var(--purple) 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;
  filter:drop-shadow(0 0 26px rgba(168,85,247,.5));
  animation:welcomeGlow 4s ease-in-out infinite;
}
@keyframes welcomeGlow{
  0%,100%{filter:drop-shadow(0 0 22px rgba(168,85,247,.4))}
  50%{filter:drop-shadow(0 0 40px rgba(168,85,247,.75))}
}
.welcome p{
  color:var(--muted);
  max-width:520px;line-height:1.9;
  font-size:.98rem;
}
.welcome-chips{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
  margin-top:8px;
}
.welcome-chips button{
  padding:12px 20px;
  background:var(--glass-2);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  color:var(--text-soft);
  border:1px solid var(--stroke);
  border-radius:16px;
  cursor:pointer;font-family:inherit;font-size:.85rem;
  display:flex;align-items:center;gap:10px;
  transition:all .3s var(--ease-soft);
}
.welcome-chips button i{color:var(--purple-3);font-size:.95rem}
.welcome-chips button:hover{
  background:linear-gradient(135deg,rgba(168,85,247,.28),rgba(124,58,237,.28));
  border-color:var(--stroke-hot);
  color:#fff;
  transform:translateY(-3px);
  box-shadow:0 12px 32px rgba(168,85,247,.35);
}

/* ─── Messages ─── */
.msg{
  max-width:82%;
  padding:16px 20px;
  border-radius:20px;
  line-height:1.75;
  word-wrap:break-word;
  position:relative;
  animation:msgIn .55s var(--ease);
  font-size:.94rem;
  isolation:isolate;
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(14px) scale(.98)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* User bubble */
.msg.user{
  align-self:flex-end;
  background:linear-gradient(135deg,var(--purple),var(--purple-2));
  color:#fff;
  border-bottom-left-radius:6px;
  box-shadow:
    0 8px 30px rgba(168,85,247,.35),
    inset 0 1px 0 rgba(255,255,255,.15);
}

/* Bot bubble - glassmorphism */
.msg.bot{
  align-self:flex-start;
  background:var(--glass-1);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid var(--stroke);
  border-bottom-right-radius:6px;
  color:var(--text);
  box-shadow:
    0 8px 30px rgba(0,0,0,.35),
    inset 0 1px 0 rgba(255,255,255,.06),
    0 0 30px rgba(168,85,247,.12);
  position:relative;
}
.msg.bot::before{
  content:"";
  position:absolute;
  inset:0;
  border-radius:20px;
  padding:1px;
  background:linear-gradient(135deg,
    rgba(168,85,247,.5),
    rgba(168,85,247,.05) 40%,
    rgba(168,85,247,.05) 60%,
    rgba(192,132,252,.4));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  opacity:.7;
}
.msg.error{
  align-self:center;
  background:rgba(239,68,68,.15);
  border:1px solid rgba(239,68,68,.5);
  color:#fca5a5;
  font-size:.88rem;
  text-align:center;
  max-width:90%;
  backdrop-filter:blur(14px);
}
.msg.info{
  align-self:center;
  background:rgba(168,85,247,.1);
  border:1px solid var(--stroke-2);
  color:var(--purple-3);
  font-size:.82rem;
  text-align:center;
  padding:10px 20px;
  backdrop-filter:blur(14px);
}

/* Message header */
.sender{
  font-weight:800;
  font-size:.74rem;
  margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
  opacity:.85;
  letter-spacing:.3px;
}
.sender .avatar{
  width:22px;height:22px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:.65rem;
  color:#fff;
}
.msg.user .sender .avatar{background:rgba(255,255,255,.25)}
.msg.bot .sender .avatar{background:linear-gradient(135deg,var(--purple),var(--purple-2));box-shadow:0 0 14px var(--purple-glow)}

/* Content */
.content{white-space:pre-wrap;word-wrap:break-word}
.content img.attached{
  max-width:100%;border-radius:14px;margin:10px 0;
  border:1px solid var(--stroke);display:block;
}

/* Code blocks */
pre{
  background:rgba(5,6,12,.85);
  border:1px solid rgba(168,85,247,.28);
  border-radius:14px;
  padding:46px 18px 18px 18px;
  margin:12px 0;
  overflow-x:auto;
  direction:ltr;
  text-align:left;
  font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,monospace;
  font-size:.84rem;
  line-height:1.6;
  position:relative;
  white-space:pre;
  box-shadow:inset 0 0 40px rgba(168,85,247,.06);
}
pre::before{
  content:"";
  position:absolute;top:0;left:0;right:0;height:34px;
  background:linear-gradient(180deg, rgba(168,85,247,.12), rgba(168,85,247,.02));
  border-bottom:1px solid rgba(168,85,247,.15);
  border-radius:14px 14px 0 0;
  pointer-events:none;
}
pre code{display:block;white-space:pre;color:#d8e0f0}

.inline-code{
  background:rgba(5,6,12,.7);
  border:1px solid var(--stroke);
  border-radius:6px;
  padding:2px 8px;
  font-family:'JetBrains Mono',monospace;
  font-size:.85em;
  color:var(--purple-3);
  direction:ltr;
  display:inline-block;
}

/* Copy button */
.copy-btn{
  position:absolute;
  top:6px;right:10px;
  padding:6px 14px;
  background:linear-gradient(135deg,var(--purple),var(--purple-2));
  color:#fff;
  border:none;
  border-radius:9px;
  cursor:pointer;
  font-family:inherit;
  font-size:.72rem;
  font-weight:700;
  display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 16px rgba(168,85,247,.45);
  transition:all .25s var(--ease-soft);
  z-index:2;
}
.copy-btn:hover{box-shadow:0 6px 24px rgba(168,85,247,.75);transform:translateY(-1px)}
.copy-btn.done{background:var(--success);box-shadow:0 4px 16px rgba(16,185,129,.5)}

/* Source badge */
.source-badge{
  font-size:.66rem;
  color:var(--muted);
  margin-top:12px;
  padding-top:10px;
  border-top:1px dashed rgba(168,85,247,.18);
  display:flex;align-items:center;gap:6px;
  opacity:.85;
}
.source-badge i{color:var(--purple-3)}

/* Speak button on bot message */
.speak-btn{
  position:absolute;
  top:10px;left:10px;
  width:32px;height:32px;
  background:var(--glass-3);
  border:1px solid var(--stroke);
  color:var(--text-soft);
  border-radius:50%;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;
  transition:all .25s var(--ease-soft);
  z-index:2;
  backdrop-filter:blur(10px);
}
.speak-btn:hover{
  background:var(--purple);color:#fff;border-color:transparent;
  box-shadow:0 0 22px var(--purple-glow);
  transform:scale(1.1);
}

/* Streaming cursor */
.streaming-cursor{
  display:inline-block;
  width:8px;height:18px;
  background:var(--purple);
  vertical-align:middle;
  margin-right:5px;
  box-shadow:0 0 12px var(--purple-glow);
  animation:cursorBlink .85s infinite;
  border-radius:2px;
}
@keyframes cursorBlink{0%,100%{opacity:1}50%{opacity:0}}

/* Typing indicator */
.typing{
  align-self:flex-start;
  padding:16px 22px;
  background:var(--glass-1);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border:1px solid var(--stroke);
  border-radius:20px;
  display:flex;gap:7px;
  box-shadow:0 8px 30px rgba(0,0,0,.3), 0 0 26px rgba(168,85,247,.15);
}
.typing span{
  width:9px;height:9px;border-radius:50%;
  background:var(--purple);
  box-shadow:0 0 14px var(--purple-glow);
  animation:typingDot 1.3s infinite;
}
.typing span:nth-child(2){animation-delay:.18s}
.typing span:nth-child(3){animation-delay:.36s}
@keyframes typingDot{
  0%,60%,100%{transform:translateY(0);opacity:.4}
  30%{transform:translateY(-9px);opacity:1}
}

/* ═══════════════════════════════════════════════════════════
   INPUT AREA
   ═══════════════════════════════════════════════════════════ */
.input-wrap{
  background:linear-gradient(180deg, rgba(10,13,24,.35), rgba(10,13,24,.75));
  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  border-top:1px solid var(--stroke);
  padding:16px 22px 18px;
}
.input-inner{max-width:1080px;margin:0 auto;position:relative}

/* Image preview */
.preview{
  display:none;
  padding:12px 16px;
  background:var(--glass-2);
  backdrop-filter:blur(16px);
  border:1px solid var(--stroke);
  border-radius:16px;
  align-items:center;gap:14px;
  margin-bottom:12px;
  animation:fadeUp .35s var(--ease-soft);
}
.preview.show{display:flex}
.preview img{max-width:64px;max-height:64px;border-radius:12px;border:1px solid var(--stroke);object-fit:cover}
.preview .info{flex:1;font-size:.82rem;color:var(--muted)}
.preview .rm{
  background:rgba(239,68,68,.15);
  color:#fca5a5;border:1px solid rgba(239,68,68,.4);
  border-radius:10px;padding:8px 14px;
  cursor:pointer;font-family:inherit;font-size:.78rem;
  display:flex;align-items:center;gap:6px;
  transition:all .25s;
}
.preview .rm:hover{background:var(--danger);color:#fff}

/* Voice indicator */
.voice-pill{
  display:none;
  padding:10px 20px;
  background:linear-gradient(135deg, rgba(168,85,247,.25), rgba(124,58,237,.25));
  backdrop-filter:blur(16px);
  border:1px solid var(--stroke-hot);
  border-radius:50px;
  color:var(--purple-3);
  font-size:.82rem;font-weight:600;
  align-items:center;gap:14px;
  margin-bottom:12px;
  box-shadow:0 0 24px rgba(168,85,247,.3);
  animation:fadeUp .3s;
  width:fit-content;
}
.voice-pill.show{display:flex}
.voice-wave{display:flex;gap:3px;align-items:center;height:20px}
.voice-wave span{
  width:3px;background:var(--purple-3);border-radius:2px;
  animation:wave 1.1s infinite ease-in-out;
}
.voice-wave span:nth-child(1){animation-delay:0s;height:8px}
.voice-wave span:nth-child(2){animation-delay:.1s;height:16px}
.voice-wave span:nth-child(3){animation-delay:.2s;height:11px}
.voice-wave span:nth-child(4){animation-delay:.3s;height:18px}
.voice-wave span:nth-child(5){animation-delay:.4s;height:10px}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* Input box — glass shell */
.input-box{
  background:var(--glass-1);
  backdrop-filter:blur(28px) saturate(170%);
  -webkit-backdrop-filter:blur(28px) saturate(170%);
  border:1px solid var(--stroke);
  border-radius:26px;
  padding:16px 18px 12px;
  display:flex;flex-direction:column;gap:10px;
  box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.06),
    0 0 40px rgba(168,85,247,.08);
  transition:border-color .35s, box-shadow .35s;
  position:relative;
  overflow:hidden;
}
.input-box::before{
  content:"";
  position:absolute;inset:0;
  border-radius:26px;
  padding:1.2px;
  background:linear-gradient(135deg,
    rgba(168,85,247,.35),
    rgba(168,85,247,.02) 30%,
    rgba(168,85,247,.02) 70%,
    rgba(192,132,252,.35));
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  opacity:.65;
  transition:opacity .35s;
}
.input-box:focus-within{
  border-color:var(--stroke-2);
  box-shadow:
    0 20px 60px rgba(0,0,0,.4),
    0 0 40px rgba(168,85,247,.28),
    0 0 80px rgba(168,85,247,.12),
    inset 0 1px 0 rgba(255,255,255,.08);
}
.input-box:focus-within::before{opacity:1}

textarea{
  width:100%;
  min-height:130px;
  max-height:360px;
  background:transparent;
  border:none;
  outline:none;
  resize:none;
  color:var(--text);
  font-family:inherit;
  font-size:1rem;
  line-height:1.75;
  padding:6px 4px;
  scrollbar-width:thin;
  scrollbar-color:rgba(168,85,247,.3) transparent;
}
textarea::-webkit-scrollbar{width:6px}
textarea::-webkit-scrollbar-thumb{background:rgba(168,85,247,.28);border-radius:3px}
textarea::placeholder{color:var(--muted);opacity:.7}

@media(max-width:640px){
  textarea{min-height:100px;font-size:.95rem}
}

/* Actions row */
.input-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.icon-group{display:flex;gap:8px;align-items:center}

/* Round glowing buttons */
.icon-btn{
  width:44px;height:44px;
  border-radius:50%;
  border:1px solid var(--stroke);
  background:var(--glass-2);
  color:var(--text-soft);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;
  position:relative;
  overflow:hidden;
  transition:all .3s var(--ease);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.icon-btn::before{
  content:"";
  position:absolute;inset:-1px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--purple-2),var(--purple-3));
  opacity:0;
  transition:opacity .3s;
  z-index:-1;
}
.icon-btn::after{
  content:"";
  position:absolute;inset:-6px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--purple),var(--purple-2));
  filter:blur(12px);
  opacity:0;
  transition:opacity .3s;
  z-index:-2;
}
.icon-btn:hover{
  color:#fff;
  border-color:transparent;
  transform:translateY(-3px) scale(1.08);
  box-shadow:0 8px 28px rgba(168,85,247,.55);
}
.icon-btn:hover::before{opacity:1}
.icon-btn:hover::after{opacity:.75}

.icon-btn.recording{
  background:linear-gradient(135deg,var(--danger),#dc2626);
  color:#fff;border-color:transparent;
  animation:recPulse 1.5s infinite;
}
@keyframes recPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.6), 0 0 22px rgba(239,68,68,.5)}
  50%{box-shadow:0 0 0 14px rgba(239,68,68,0), 0 0 36px rgba(239,68,68,.8)}
}
.icon-btn.speaking{
  background:linear-gradient(135deg,var(--warning),#d97706);
  color:#fff;border-color:transparent;
  box-shadow:0 0 22px rgba(245,158,11,.55);
}

/* Send button */
.send-btn{
  height:44px;
  padding:0 26px;
  border:none;
  border-radius:50px;
  background:linear-gradient(135deg,var(--purple),var(--purple-2));
  color:#fff;
  cursor:pointer;
  font-family:inherit;
  font-size:.92rem;
  font-weight:800;
  display:flex;align-items:center;gap:9px;
  position:relative;
  overflow:hidden;
  box-shadow:
    0 0 24px rgba(168,85,247,.5),
    0 0 60px rgba(168,85,247,.2),
    inset 0 0 18px rgba(255,255,255,.15);
  transition:all .3s var(--ease);
}
.send-btn::before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);
  transform:translateX(-120%);
  animation:btnShine 4s ease-in-out infinite;
  pointer-events:none;
}
.send-btn:hover:not(:disabled){
  transform:translateY(-3px) scale(1.04);
  box-shadow:
    0 0 40px rgba(168,85,247,.85),
    0 0 90px rgba(168,85,247,.4),
    inset 0 0 24px rgba(255,255,255,.22);
}
.send-btn:disabled{opacity:.45;cursor:not-allowed}
.send-btn.stopping{
  background:linear-gradient(135deg,var(--danger),#dc2626);
  box-shadow:0 0 28px rgba(239,68,68,.6), inset 0 0 18px rgba(255,255,255,.15);
}
.send-btn i{font-size:.95rem}

/* Hint row */
.hint{
  display:flex;justify-content:center;gap:20px;
  margin-top:10px;
  font-size:.72rem;color:var(--muted);opacity:.7;
  flex-wrap:wrap;
  align-items:center;
}
.hint .keys{display:flex;gap:6px;align-items:center}
.kbd{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:24px;height:22px;
  padding:0 8px;
  background:var(--glass-2);
  border:1px solid var(--stroke);
  border-radius:7px;
  font-family:monospace;
  font-size:.7rem;
  color:var(--purple-3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
}

/* Overlay (mobile sidebar) */
.overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(4px);
  -webkit-backdrop-filter:blur(4px);
  z-index:55;
}
.overlay.show{display:block;animation:fadeIn .25s}

/* ═══════════════════════════════════════════════════════════
   MODAL
   ═══════════════════════════════════════════════════════════ */
.modal{
  position:fixed;inset:0;
  background:rgba(5,6,12,.85);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  display:none;align-items:center;justify-content:center;
  padding:22px;z-index:300;
}
.modal.show{display:flex;animation:fadeIn .28s}
.modal-box{
  background:var(--glass-1);
  backdrop-filter:blur(30px) saturate(170%);
  -webkit-backdrop-filter:blur(30px) saturate(170%);
  border:1px solid var(--stroke-2);
  border-radius:24px;
  padding:28px;
  max-width:520px;width:100%;
  box-shadow:
    0 30px 90px rgba(0,0,0,.65),
    0 0 70px rgba(168,85,247,.25);
  position:relative;
  animation:modalIn .4s var(--ease);
}
@keyframes modalIn{
  from{opacity:0;transform:scale(.94) translateY(16px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.modal-box h3{
  font-size:1.15rem;font-weight:800;
  margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
  color:var(--purple-3);
}
.modal-box h3 i{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,var(--purple),var(--purple-2));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:.85rem;
  box-shadow:0 0 20px rgba(168,85,247,.5);
}
.modal-box label{
  display:block;font-size:.82rem;color:var(--muted);
  margin:14px 0 8px;
}
.modal-box textarea{
  width:100%;min-height:120px;max-height:none;
  background:rgba(10,13,24,.6);
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:14px;
  color:var(--text);
  font-family:inherit;font-size:.92rem;
  resize:vertical;
  outline:none;
  transition:border-color .3s, box-shadow .3s;
}
.modal-box textarea:focus{
  border-color:var(--stroke-2);
  box-shadow:0 0 24px rgba(168,85,247,.25);
}
.modal-actions{display:flex;gap:10px;margin-top:22px}
.modal-actions button{
  flex:1;
  padding:13px;
  border-radius:14px;
  border:none;
  font-family:inherit;
  font-weight:800;
  font-size:.9rem;
  cursor:pointer;
  transition:all .28s var(--ease-soft);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.modal-actions .cancel{
  background:var(--glass-2);color:var(--text-soft);
  border:1px solid var(--stroke);
}

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG
   ═══════════════════════════════════════════════════════════════ */
const API_BASE = '/api/v1';
const IS_STANDALONE = location.protocol === 'file:';
let DEMO_MODE = IS_STANDALONE;   // auto-detects
let API_REACHABLE = false;

/* User ID */
let USER_ID = localStorage.getItem('khallaqi_user_id');
if (!USER_ID) {
  USER_ID = 'u_' + Math.random().toString(36).slice(2) + Date.now();
  localStorage.setItem('khallaqi_user_id', USER_ID);
}

/* State */
let currentChatId = null;
let chats = [];
let isSending = false;
let selectedImage = null;
let selectedImageType = 'image/jpeg';
let streamAbort = null;
let ttsEnabled = localStorage.getItem('khallaqi_tts') === 'true';
let liveMode = false;
let isRecording = false;
let isSpeaking = false;
let recognition = null;
let currentAudio = null;
let azureAvailable = false;

/* DOM */
const splash = document.getElementById('splash');
const appEl = document.getElementById('app');
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const sendLabel = document.getElementById('sendLabel');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const micBtn = document.getElementById('micBtn');
const fileInput = document.getElementById('fileInput');
const previewBox = document.getElementById('previewBox');
const previewImg = document.getElementById('previewImg');
const ttsToggle = document.getElementById('ttsToggle');
const liveModeBtn = document.getElementById('liveModeBtn');
const voiceIndicator = document.getElementById('voiceIndicator');
const voiceStatusText = document.getElementById('voiceStatusText');
const toastEl = document.getElementById('toast');
const toastText = document.getElementById('toastText');

/* ═══════════════════════════════════════════════════════════════
   SPLASH — particles + sound
   ═══════════════════════════════════════════════════════════════ */
(function createSplashParticles() {
  const container = document.getElementById('splashParticles');
  const N = 70;
  for (let i = 0; i < N; i++) {
    const p = document.createElement('span');
    const angle = Math.random() * Math.PI * 2;
    const dist = 480 + Math.random() * 640;
    const px = Math.cos(angle) * dist;
    const py = Math.sin(angle) * dist;
    p.style.setProperty('--px', px + 'px');
    p.style.setProperty('--py', py + 'px');
    p.style.setProperty('--pd', (Math.random() * 1.2) + 's');
    // Some dots bigger/smaller
    const size = 2 + Math.random() * 4;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    container.appendChild(p);
  }
})();

/* Sound: intro-sound.mp3 placeholder (silently ignored if missing) */
function playIntroSound() {
  try {
    const a = new Audio('intro-sound.mp3');
    a.volume = 0.65;
    a.play().catch(() => {
      // Browser blocked audio (autoplay policy) or file missing.
      // Fallback: synthesize a chime.
      playSynthChime();
    });
  } catch (e) {
    playSynthChime();
  }
}

/* Synth fallback chime (nice A-major arpeggio) */
function playSynthChime() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const notes = [440, 554.37, 659.25, 880]; // A C# E A
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t0 = ctx.currentTime + i * 0.11;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.14, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.9);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 1.0);
    });
  } catch (e) { /* ignore */ }
}

/* Play sound at the moment the logo finishes assembling */
const LOGO_ASSEMBLE_DONE_MS = 1_000 + 1_900; // delay + duration
setTimeout(() => { playIntroSound(); }, LOGO_ASSEMBLE_DONE_MS);

/* Start button → enter app */
document.getElementById('startBtn').addEventListener('click', () => {
  splash.classList.add('leaving');
  setTimeout(() => {
    splash.style.display = 'none';
    appEl.classList.add('visible');
    initApp();
  }, 700);
});

/* ═══════════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════════ */
let toastTimer = null;
function showToast(text, kind = 'success') {
  toastText.textContent = text;
  toastEl.className = 'toast show ' + kind;
  const icon = toastEl.querySelector('i');
  if (kind === 'error') icon.className = 'fa-solid fa-circle-exclamation';
  else if (kind === 'info') icon.className = 'fa-solid fa-circle-info';
  else icon.className = 'fa-solid fa-circle-check';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.classList.remove('show');
  }, 2600);
}

/* ═══════════════════════════════════════════════════════════════
   API — with demo fallback
   ═══════════════════════════════════════════════════════════════ */
async function api(path, options = {}) {
  options.headers = options.headers || {};
  if (!options.headers['X-User-ID']) options.headers['X-User-ID'] = USER_ID;
  if (options.body && typeof options.body === 'string' && !options.headers['Content-Type']) {
    options.headers['Content-Type'] = 'application/json';
  }
  const r = await fetch(path, options);
  const raw = await r.text();
  let data;
  try { data = raw ? JSON.parse(raw) : {}; } catch (e) { throw new Error('رد غير متوقع'); }
  if (!r.ok) {
    const e = new Error(data.error || data.message || ('HTTP ' + r.status));
    e.status = r.status;
    throw e;
  }
  return data;
}

/* Detect backend */
async function detectBackend() {
  if (IS_STANDALONE) { DEMO_MODE = true; return; }
  try {
    const r = await fetch(API_BASE + '/status');
    if (r.ok) { API_REACHABLE = true; DEMO_MODE = false; return; }
  } catch (e) { /* ignore */ }
  DEMO_MODE = true;
}

/* ═══════════════════════════════════════════════════════════════
   SPEECH — TTS
   ═══════════════════════════════════════════════════════════════ */
const VOICE_CONFIG = {
  lang: 'ar-SA',
  pitch: 1.08,
  rate: 1.0,
  volume: 1.0,
  preferKeywords: ['hamed', 'hameed', 'حامد', 'male', 'majed', 'naayf', 'shakir', 'رجل']
};

function updateTtsUI() { ttsToggle.classList.toggle('active', ttsEnabled); }
function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  localStorage.setItem('khallaqi_tts', ttsEnabled ? 'true' : 'false');
  updateTtsUI();
  if (ttsEnabled) speakText('تم تفعيل قراءة الردود');
  else stopSpeaking();
}
updateTtsUI();

function pickArabicMaleVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if (!voices || !voices.length) return null;
  return (
    voices.find(x => {
      const n = x.name.toLowerCase(), l = x.lang.toLowerCase();
      return (l.startsWith('ar-sa') || l.includes('sa')) &&
             VOICE_CONFIG.preferKeywords.some(k => n.includes(k.toLowerCase()));
    }) ||
    voices.find(x => {
      const n = x.name.toLowerCase(), l = x.lang.toLowerCase();
      return l.startsWith('ar') &&
             VOICE_CONFIG.preferKeywords.some(k => n.includes(k.toLowerCase()));
    }) ||
    voices.find(x => x.lang.toLowerCase().startsWith('ar-sa')) ||
    voices.find(x => x.lang.toLowerCase().startsWith('ar')) ||
    null
  );
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

async function speakText(text) {
  if (!text) return;
  stopSpeaking();
  if (azureAvailable && !DEMO_MODE) {
    try {
      const blob = await fetchAzureTTS(text);
      if (blob) { await playAudioBlob(blob); return; }
    } catch (e) { /* fall through */ }
  }
  speakWebSpeech(text);
}

async function fetchAzureTTS(text) {
  try {
    const r = await fetch(API_BASE + '/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-User-ID': USER_ID },
      body: JSON.stringify({ text })
    });
    if ((r.headers.get('content-type') || '').includes('audio')) return await r.blob();
    return null;
  } catch (e) { return null; }
}

function playAudioBlob(blob) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;
    isSpeaking = true;
    micBtn.classList.add('speaking');
    const done = () => {
      isSpeaking = false;
      micBtn.classList.remove('speaking');
      URL.revokeObjectURL(url);
      currentAudio = null;
      resolve();
      onSpeechEnd();
    };
    audio.onended = done;
    audio.onerror = done;
    audio.play().catch(() => done());
  });
}

function speakWebSpeech(text) {
  if (!('speechSynthesis' in window)) return;
  let clean = text
    .replace(/```[\s\S]*?```/g, ' كود ')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/[#*_]/g, '')
    .substring(0, 600);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = VOICE_CONFIG.lang;
  u.pitch = VOICE_CONFIG.pitch;
  u.rate = VOICE_CONFIG.rate;
  u.volume = VOICE_CONFIG.volume;
  const v = pickArabicMaleVoice();
  if (v) u.voice = v;
  u.onstart = () => { isSpeaking = true; micBtn.classList.add('speaking'); };
  u.onend = () => { isSpeaking = false; micBtn.classList.remove('speaking'); onSpeechEnd(); };
  u.onerror = () => { isSpeaking = false; micBtn.classList.remove('speaking'); onSpeechEnd(); };
  window.speechSynthesis.speak(u);
}

function stopSpeaking() {
  if (currentAudio) { try { currentAudio.pause(); } catch (e) {} currentAudio = null; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  isSpeaking = false;
  micBtn.classList.remove('speaking');
}
function onSpeechEnd() {
  if (liveMode && !isRecording) {
    setTimeout(() => { if (liveMode && !isSending) startVoice(); }, 500);
  }
}

/* ═══════════════════════════════════════════════════════════════
   SPEECH — STT
   ═══════════════════════════════════════════════════════════════ */
function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return null;
  const r = new SR();
  r.lang = 'ar-SA';
  r.continuous = false;
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onresult = e => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) final += t; else interim += t;
    }
    inputEl.value = final || interim;
    if (final) {
      voiceStatusText.textContent = 'تم الالتقاط...';
      setTimeout(() => { if (!isSending) sendMsg(); }, 500);
    }
  };
  r.onerror = e => {
    if (e.error === 'not-allowed') showToast('يجب السماح بالوصول إلى الميكروفون', 'error');
    else if (e.error === 'no-speech') showToast('لم يتم التقاط صوت', 'info');
    stopVoice();
  };
  r.onend = () => stopVoice();
  return r;
}
function toggleVoice() { isRecording ? stopVoice() : startVoice(); }
function startVoice() {
  if (isSpeaking) { stopSpeaking(); return; }
  if (!recognition) recognition = initRecognition();
  if (!recognition) { showToast('المتصفح لا يدعم التعرف على الصوت', 'error'); return; }
  try {
    recognition.start();
    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.innerHTML = '<i class="fa-solid fa-stop"></i>';
    voiceIndicator.classList.add('show');
    voiceStatusText.textContent = 'جاري الاستماع...';
  } catch (e) { /* ignore */ }
}
function stopVoice() {
  if (recognition && isRecording) { try { recognition.stop(); } catch (e) {} }
  isRecording = false;
  micBtn.classList.remove('recording');
  micBtn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
  voiceIndicator.classList.remove('show');
}
function toggleLiveMode() {
  liveMode = !liveMode;
  if (liveMode) {
    liveModeBtn.classList.add('live');
    ttsEnabled = true;
    localStorage.setItem('khallaqi_tts', 'true');
    updateTtsUI();
    showToast('المحادثة الصوتية مفعّلة', 'info');
    startVoice();
  } else {
    liveModeBtn.classList.remove('live');
    stopVoice();
    stopSpeaking();
    showToast('تم إيقاف المحادثة الصوتية', 'info');
  }
}

   IMAGE
   ═══════════════════════════════════════════════════════════════ */
function pickImage() { fileInput.click(); }
function handleFileSelect(e) {
  const f = e.target.files[0];
  if (!f) return;
  if (!f.type.startsWith('image/')) { showToast('يرجى اختيار صورة صحيحة', 'error'); return; }
  if (f.size > 10 * 1024 * 1024) { showToast('حجم الصورة كبير (الحد 10MB)', 'error'); return; }
  selectedImageType = f.type;
  const reader = new FileReader();
  reader.onload = ev => {
    selectedImage = ev.target.result;
    previewImg.src = selectedImage;
    document.getElementById('previewInfo').textContent = `${(f.size / 1024).toFixed(1)} كيلوبايت`;
    previewBox.classList.add('show');
  };
  reader.readAsDataURL(f);
  fileInput.value = '';
}
function removeImage() {
  selectedImage = null;
  previewImg.src = '';
  previewBox.classList.remove('show');
}

/* ═══════════════════════════════════════════════════════════════
   VIDEO
   ═══════════════════════════════════════════════════════════════ */
function openVideoModal() { document.getElementById('videoModal').classList.add('show'); }
function closeVideoModal() { document.getElementById('videoModal').classList.remove('show'); }
async function generateVideo() {
  const prompt = document.getElementById('videoPrompt').value.trim();
  if (!prompt) { showToast('الوصف مطلوب', 'error'); return; }
  if (!currentChatId) await newChat();
  closeVideoModal();
  addMessage('طلب توليد فيديو: ' + prompt, 'user');
  if (DEMO_MODE) {
    setTimeout(() => {
      addMessage('عرض توضيحي: في الوضع التجريبي لا يمكن توليد الفيديو فعلياً.', 'info');
    }, 700);
    return;
  }
  showTyping();
  try {
    const d = await api(API_BASE + '/generate-video', {
      method: 'POST',
      body: JSON.stringify({ prompt, chat_id: currentChatId, user_id: USER_ID })
    });
    hideTyping();
    if (d.error) { addMessage(d.error, 'error'); return; }
    addMessage('تم بدء التوليد، رقم العملية: ' + d.operation, 'bot', d.model);
    pollVideo(d.operation);
  } catch (e) { hideTyping(); addMessage(e.message, 'error'); }
}
function pollVideo(op, n = 0) {
  if (n > 60) { addMessage('الفيديو يستغرق وقتاً أطول من المتوقع', 'info'); return; }
  setTimeout(async () => {
    try {
      const d = await api(API_BASE + '/video-status', { method: 'POST', body: JSON.stringify({ operation: op }) });
      if (d.done && d.video_url) {
        addMessage('تم توليد الفيديو بنجاح. ' + d.video_url, 'bot');
      } else if (!d.done) pollVideo(op, n + 1);
    } catch (e) { pollVideo(op, n + 1); }
  }, 10000);
}

async function loadChats() {
  if (DEMO_MODE) {
    try {
      const local = JSON.parse(localStorage.getItem('khallaqi_demo_chats') || '[]');
      chats = local;
      renderChats();
    } catch (e) { chats = []; renderChats(); }
    return;
  }
  try {
    const d = await api(API_BASE + '/chats');
    chats = d.chats || [];
    renderChats();
  } catch (e) { /* ignore */ }
}

function saveDemoChats() {
  if (!DEMO_MODE) return;
  try { localStorage.setItem('khallaqi_demo_chats', JSON.stringify(chats)); } catch (e) {}
}

function renderChats() {
  const list = document.getElementById('chatsList');
  if (!chats.length) {
    list.innerHTML = '<div class="chats-empty">لا توجد محادثات بعد</div>';
    return;
  }
  list.innerHTML = '';
  chats.forEach(c => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');

    const icon = document.createElement('i');
    icon.className = 'fa-regular fa-comment icon';

    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = c.title || 'محادثة';

    const del = document.createElement('button');
    del.className = 'del';
    del.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
    del.title = 'حذف';
    del.onclick = ev => { ev.stopPropagation(); deleteChat(c.id); };

    item.appendChild(icon);
    item.appendChild(title);
    item.appendChild(del);
    item.onclick = ev => {
      if (ev.target.closest('.del')) return;
      openChat(c.id);
    };
    list.appendChild(item);
  });
}

async function newChat() {
  if (DEMO_MODE) {
    const id = 'demo-' + Date.now();
    const chat = { id, title: 'محادثة جديدة', created_at: new Date().toISOString(), updated_at: new Date().toISOString() };
    chats = [chat, ...chats];
    saveDemoChats();
    currentChatId = id;
    renderChats();
    showWelcome();
    if (window.innerWidth <= 880) toggleSidebar();
    return;
  }
  try {
    const d = await api(API_BASE + '/chats/new', {
      method: 'POST',
      body: JSON.stringify({ user_id: USER_ID })
    });
    if (!d.chat_id) { showToast('فشل إنشاء محادثة', 'error'); return; }
    currentChatId = d.chat_id;
    await loadChats();
    showWelcome();
    if (window.innerWidth <= 880) toggleSidebar();
  } catch (e) { showToast(e.message, 'error'); }
}

async function openChat(id) {
  currentChatId = id;
  await loadChats();
  chatEl.innerHTML = '';
  if (DEMO_MODE) {
    try {
      const msgs = JSON.parse(localStorage.getItem('khallaqi_demo_msgs_' + id) || '[]');
      if (msgs.length) msgs.forEach(m => addMessage(m.content, m.role, m.source, false, m.type, m.media));
      else showWelcome();
    } catch (e) { showWelcome(); }
    if (window.innerWidth <= 880) toggleSidebar();
    return;
  }
  try {
    const d = await api(API_BASE + '/chats/' + id);
    if (d.messages && d.messages.length) {
      d.messages.forEach(m => {
        addMessage(m.content, m.role === 'user' ? 'user' : 'bot', m.source, false, m.type, m.media);
      });
      chatEl.scrollTop = chatEl.scrollHeight;
    } else showWelcome();
  } catch (e) { showToast(e.message, 'error'); }
  if (window.innerWidth <= 880) toggleSidebar();
}

async function deleteChat(id) {
  if (!confirm('هل تريد حذف هذه المحادثة نهائياً؟')) return;
  if (DEMO_MODE) {
    chats = chats.filter(c => c.id !== id);
    saveDemoChats();
    localStorage.removeItem('khallaqi_demo_msgs_' + id);
    if (currentChatId === id) { currentChatId = null; showWelcome(); }
    renderChats();
    return;
  }
  try {
    await api(API_BASE + '/chats/' + id, {
      method: 'DELETE',
      body: JSON.stringify({ user_id: USER_ID })
    });
    if (currentChatId === id) { currentChatId = null; showWelcome(); }
    await loadChats();
  } catch (e) { showToast(e.message, 'error'); }
}

function clearCurrentChat() {
  if (!currentChatId) { showToast('لا توجد محادثة مفتوحة', 'info'); return; }
  if (!confirm('سيتم حذف رسائل هذه المحادثة فقط. متابعة؟')) return;
  chatEl.innerHTML = '';
  if (DEMO_MODE) {
    localStorage.removeItem('khallaqi_demo_msgs_' + currentChatId);
  }
  showWelcome();
  showToast('تم تفريغ المحادثة');
}

/* ═══════════════════════════════════════════════════════════════
   RENDER MESSAGE CONTENT (with code blocks)
   ═══════════════════════════════════════════════════════════════ */
function renderContent(el, text) {
  const parts = String(text).split('```');
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) {
      // Regular text — handle inline code with backticks
      const sub = parts[i].split('`');
      sub.forEach((sp, j) => {
        if (j % 2 === 0) {
          if (sp) {
            const node = document.createTextNode(sp);
            el.appendChild(node);
          }
        } else {
          const c = document.createElement('span');
          c.className = 'inline-code';
          c.textContent = sp;
          el.appendChild(c);
        }
      });
    } else {
      // Code block
      const pre = document.createElement('pre');
      const codeText = parts[i].replace(/^[a-zA-Z0-9_+\-#\.]*\n/, '');
      const code = document.createElement('code');
      code.textContent = codeText;
      pre.appendChild(code);

      const btn = document.createElement('button');
      btn.className = 'copy-btn';
      btn.type = 'button';
      btn.innerHTML = '<i class="fa-regular fa-copy"></i> نسخ';
      btn.onclick = () => {
        navigator.clipboard.writeText(codeText).then(() => {
          btn.innerHTML = '<i class="fa-solid fa-check"></i> تم';
          btn.classList.add('done');
          setTimeout(() => {
            btn.innerHTML = '<i class="fa-regular fa-copy"></i> نسخ';
            btn.classList.remove('done');
          }, 1600);
        }).catch(() => showToast('فشل النسخ', 'error'));
      };
      pre.appendChild(btn);
      el.appendChild(pre);
    }
  }
}

/* ═══════════════════════════════════════════════════════════════
   ADD MESSAGE
   ═══════════════════════════════════════════════════════════════ */
function addMessage(text, role, source, save = true, type = 'text', media = null) {
  if (chatEl.querySelector('.welcome')) chatEl.innerHTML = '';

  const msg = document.createElement('div');
  msg.className = 'msg ' + role;

  // Sender header
  if (role !== 'error' && role !== 'info') {
    const sender = document.createElement('div');
    sender.className = 'sender';
    const avatar = document.createElement('span');
    avatar.className = 'avatar';
    avatar.innerHTML = role === 'user'
      ? '<i class="fa-solid fa-user"></i>'
      : '<i class="fa-solid fa-bolt"></i>';
    sender.appendChild(avatar);
    const label = document.createElement('span');
    label.textContent = role === 'user' ? 'أنت' : 'الخلاقي';
    sender.appendChild(label);
    msg.appendChild(sender);
  }

  // Image attachment
  if (type === 'image' && media) {
    const img = document.createElement('img');
    img.className = 'attached';
    img.src = media.startsWith('data:') ? media : 'data:image/jpeg;base64,' + media;
    msg.appendChild(img);
  }

  // Content
  const content = document.createElement('div');
  content.className = 'content';
  if (role === 'error' || role === 'info') content.textContent = text;
  else renderContent(content, text);
  msg.appendChild(content);

  // Source badge
  if (source && role === 'bot') {
    const sb = document.createElement('div');
    sb.className = 'source-badge';
    sb.innerHTML = '<i class="fa-solid fa-satellite-dish"></i> ' + source;
    msg.appendChild(sb);
  }

  // Speak button for bot
  if (role === 'bot' && text && !String(text).startsWith('❌')) {
    const spk = document.createElement('button');
    spk.className = 'speak-btn';
    spk.type = 'button';
    spk.title = 'اسمع الرد';
    spk.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
    spk.onclick = () => speakText(text);
    msg.appendChild(spk);
  }

  chatEl.appendChild(msg);
  chatEl.scrollTop = chatEl.scrollHeight;

  // Auto TTS
  if (role === 'bot' && ttsEnabled && text && !String(text).startsWith('❌')) {
    speakText(text);
  }

  // Persist
  if (save && DEMO_MODE && currentChatId) {
    try {
      const key = 'khallaqi_demo_msgs_' + currentChatId;
      const arr = JSON.parse(localStorage.getItem(key) || '[]');
      arr.push({ role, content: text, source, type, media });
      localStorage.setItem(key, JSON.stringify(arr));
      // update title
      if (role === 'user' && arr.length === 1) {
        const chat = chats.find(c => c.id === currentChatId);
        if (chat) {
          chat.title = String(text).slice(0, 40);
          saveDemoChats();
          renderChats();
        }
      }
    } catch (e) {}
  }

  return msg;
}

/* ═══════════════════════════════════════════════════════════════
   SEND
   ═══════════════════════════════════════════════════════════════ */
async function sendMsg() {
  if (isSending) {
    if (streamAbort) { streamAbort.abort(); streamAbort = null; }
    return;
  }
  const text = inputEl.value.trim();
  if (!text && !selectedImage) return;

  stopSpeaking();

  if (!currentChatId) await newChat();
  if (!currentChatId) return;

  isSending = true;

  if (selectedImage) {
    await sendWithImage(text);
  } else if (DEMO_MODE) {
    await sendDemo(text);
  } else {
    await sendWithStream(text);
  }
}

/* ─── DEMO send ─── */
async function sendDemo(text) {
  addMessage(text, 'user');
  inputEl.value = '';
  inputEl.style.height = 'auto';

  showTyping();
  await new Promise(r => setTimeout(r, 700));
  hideTyping();

  const reply = `أنا الخلاقي في الوضع التجريبي.\n\nاستلمت رسالتك: "${text.slice(0, 80)}"\n\nلتفعيل الردود الحقيقية، شغّل الخادم الخلفي (Backend) ثم أعد فتح الصفحة من خلاله.\n\nمثال على كود يعمل:\n\`\`\`python\nprint("Hello from الخلاقي")\n\`\`\``;
  addMessage(reply, 'bot', 'demo');
  isSending = false;
  inputEl.focus();
}

/* ─── Image send ─── */
async function sendWithImage(text) {
  const img = selectedImage, typ = selectedImageType;
  addMessage(text || 'حلل هذه الصورة', 'user', null, true, 'image', img);
  inputEl.value = '';
  sendBtn.disabled = true;
  sendLabel.textContent = '...';

  showTyping();
  document.getElementById('activeProvider').textContent = 'يفكر...';

  try {
    if (DEMO_MODE) {
      await new Promise(r => setTimeout(r, 900));
      hideTyping();
      addMessage('الوضع التجريبي: تم استلام الصورة، لكن التحليل الحقيقي يحتاج للخادم.', 'bot', 'demo');
    } else {
      const d = await api(API_BASE + '/chat', {
        method: 'POST',
        body: JSON.stringify({
          message: text, chat_id: currentChatId, user_id: USER_ID,
          image: img, image_type: typ
        })
      });
      hideTyping();
      if (d.response) {
        addMessage(d.response, 'bot', d.source);
        document.getElementById('activeProvider').textContent = d.source || 'جاهز';
        loadChats();
      } else if (d.error) addMessage(d.error, 'error');
    }
    removeImage();
  } catch (e) {
    hideTyping();
    addMessage(e.message, 'error');
  } finally {
    isSending = false;
    sendBtn.disabled = false;
    sendLabel.textContent = 'إرسال';
    inputEl.focus();
  }
}

/* ─── Streaming send ─── */
async function sendWithStream(text) {
  addMessage(text, 'user');
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendLabel.textContent = 'إيقاف';
  sendBtn.classList.add('stopping');
  document.getElementById('activeProvider').textContent = 'يفكر...';

  if (chatEl.querySelector('.welcome')) chatEl.innerHTML = '';

  // Create empty bot bubble
  const botDiv = document.createElement('div');
  botDiv.className = 'msg bot';
  const sender = document.createElement('div');
  sender.className = 'sender';
  sender.innerHTML = '<span class="avatar"><i class="fa-solid fa-bolt"></i></span><span>الخلاقي</span>';
  botDiv.appendChild(sender);
  const contentDiv = document.createElement('div');
  contentDiv.className = 'content';
  botDiv.appendChild(contentDiv);
  const cursor = document.createElement('span');
  cursor.className = 'streaming-cursor';
  contentDiv.appendChild(cursor);
  chatEl.appendChild(botDiv);
  chatEl.scrollTop = chatEl.scrollHeight;

  let fullText = '';
  let streamSource = null;

  try {
    streamAbort = new AbortController();
    const r = await fetch(API_BASE + '/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-User-ID': USER_ID },
      body: JSON.stringify({ message: text, chat_id: currentChatId, user_id: USER_ID }),
      signal: streamAbort.signal
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let evt;
        try { evt = JSON.parse(line.substring(6)); } catch (e) { continue; }

        if (evt.provider) {
          streamSource = evt.provider;
          document.getElementById('activeProvider').textContent = evt.provider;
        } else if (evt.chunk) {
          fullText += evt.chunk;
          cursor.remove();
          contentDiv.textContent = fullText;
          contentDiv.appendChild(cursor);
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (evt.done) {
          cursor.remove();
          contentDiv.innerHTML = '';
          renderContent(contentDiv, fullText);

          if (streamSource) {
            const sb = document.createElement('div');
            sb.className = 'source-badge';
            sb.innerHTML = '<i class="fa-solid fa-satellite-dish"></i> ' + streamSource;
            botDiv.appendChild(sb);
          }
          const spk = document.createElement('button');
          spk.className = 'speak-btn';
          spk.type = 'button';
          spk.title = 'اسمع الرد';
          spk.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
          spk.onclick = () => speakText(fullText);
          botDiv.appendChild(spk);

          if (ttsEnabled && fullText) speakText(fullText);
          document.getElementById('activeProvider').textContent = streamSource || 'جاهز';
          loadChats();
        } else if (evt.error) {
          cursor.remove();
          contentDiv.textContent = evt.error;
          botDiv.className = 'msg error';
          document.getElementById('activeProvider').textContent = 'فشل';
        }
      }
    }
  } catch (e) {
    cursor.remove();
    if (e.name === 'AbortError') {
      contentDiv.innerHTML = '';
      renderContent(contentDiv, fullText + '\n\n[تم الإيقاف بواسطتك]');
    } else {
      botDiv.className = 'msg error';
      contentDiv.textContent = e.message;
    }
  } finally {
    streamAbort = null;
    isSending = false;
    sendBtn.disabled = false;
    sendLabel.textContent = 'إرسال';
    sendBtn.classList.remove('stopping');
    inputEl.focus();
  }
}

/* ═══════════════════════════════════════════════════════════════
   KEYBOARD — Enter = newline, Shift+Enter = send
   ═══════════════════════════════════════════════════════════════ */
inputEl.addEventListener('keydown', e => {
  // Shift+Enter OR Ctrl+Enter → send
  if (e.key === 'Enter' && (e.shiftKey || e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    sendMsg();
    return;
  }
  // Plain Enter → newline (default textarea behavior)
});

// Auto-resize textarea
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 360) + 'px';
});

/* ═══════════════════════════════════════════════════════════════
   STATUS & STATS
   ═══════════════════════════════════════════════════════════════ */
function setDot(id, ok, warn = false) {
  const el = document.getElementById(id);
  if (!el) return;
  el.className = 'status-dot ' + (ok ? 'ok' : (warn ? 'warn' : 'no'));
}

async function checkStatus() {
  if (DEMO_MODE) {
    showToast('أنت في الوضع التجريبي (بدون خادم)', 'info');
    return;
  }
  try {
    const d = await api(API_BASE + '/status');
    const p = d.providers || {}, f = d.features || {};
    azureAvailable = !!f.voice_tts_azure;
    setDot('dotGem', p.gemini);
    setDot('dotGroq', p.groq);
    setDot('dotRedis', d.redis_ok, !d.redis_ok);
    setDot('dotImg', f.vision);
    setDot('dotVid', f.video);
    setDot('dotTts', f.voice_tts_azure || f.voice_tts_local);
    showToast('تم تحديث الحالة');
  } catch (e) { showToast(e.message, 'error'); }
}

async function showStats() {
  if (DEMO_MODE) {
    const c = chats.length;
    let total = 0;
    chats.forEach(chat => {
      try {
        const msgs = JSON.parse(localStorage.getItem('khallaqi_demo_msgs_' + chat.id) || '[]');
        total += msgs.length;
      } catch (e) {}
    });
    alert('إحصائيات الوضع التجريبي\n\nالمحادثات: ' + c + '\nالرسائل: ' + total);
    return;
  }
  try {
    const d = await api(API_BASE + '/stats');
    let txt = 'إحصائياتك\n\n';
    txt += 'المحادثات: ' + (d.chats_count || 0) + '\n';
    txt += 'الرسائل: ' + (d.messages_count || 0) + '\n';
    txt += 'ردود الذكاء: ' + (d.assistant_count || 0) + '\n';
    txt += 'عناصر الذاكرة: ' + (d.memory_count || 0);
    alert(txt);
  } catch (e) { showToast(e.message, 'error'); }
}

/* ═══════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════ */
async function initApp() {
  await detectBackend();
  if (DEMO_MODE) {
    document.getElementById('activeProvider').textContent = 'تجريبي';
    document.getElementById('dotGem').className = 'status-dot warn';
    document.getElementById('dotGroq').className = 'status-dot warn';
  } else {
    // try status
    try {
      const d = await api(API_BASE + '/status');
      const p = d.providers || {}, f = d.features || {};
      azureAvailable = !!f.voice_tts_azure;
      setDot('dotGem', p.gemini);
      setDot('dotGroq', p.groq);
      setDot('dotRedis', d.redis_ok, !d.redis_ok);
      setDot('dotImg', f.vision);
      setDot('dotVid', f.video);
      setDot('dotTts', f.voice_tts_azure || f.voice_tts_local);
    } catch (e) { /* ignore */ }
  }

  await loadChats();
  if (chats.length > 0) await openChat(chats[0].id);
  else await newChat();

  // Focus input
  setTimeout(() => inputEl.focus(), 400);
}
</script>
