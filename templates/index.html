<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ ai_name }} للذكاء والبرمجة</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a2e;
            --text: #e0e0ff;
            --text-secondary: #a0a0c0;
            --accent: #a855f7;
            --accent-glow: #c084fc;
            --border: #2d2d44;
            --code-bg: #0d0d14;
            --code-border: #2d2d44;
            --user-bubble: #2a1a3a;
            --assistant-bubble: #1a1a2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, 'Noto Sans Arabic', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== الشعار الأرجواني المتبلور ===== */
        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0 10px;
            background: transparent;
        }

        .crystal-logo {
            width: 80px;
            height: 80px;
            position: relative;
            filter: drop-shadow(0 0 20px rgba(168, 85, 247, 0.6));
            animation: pulse 3s infinite;
        }

        .crystal-logo::before,
        .crystal-logo::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            background: linear-gradient(135deg, #a855f7, #6b21a8, #c084fc);
            background-size: 200% 200%;
            animation: shimmer 4s ease-in-out infinite;
        }

        .crystal-logo::before {
            transform: rotate(0deg);
        }

        .crystal-logo::after {
            transform: rotate(30deg);
            opacity: 0.7;
            animation-delay: 0.5s;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ===== الترويسة ===== */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header .title {
            font-size: 1.5em;
            color: var(--accent-glow);
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            font-weight: bold;
        }

        .header .subtitle {
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn-clear {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 15px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .btn-clear:hover {
            background: #2a2a44;
        }

        /* ===== منطقة المحادثة ===== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            border-bottom-left-radius: 4px;
            border: 1px solid #3d2d5e;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--assistant-bubble);
            border-bottom-right-radius: 4px;
            border: 1px solid var(--border);
        }

        .message .sender {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.8em;
            opacity: 0.8;
        }

        /* ===== تنسيق الأكواد ===== */
        .message pre {
            background: var(--code-bg);
            border: 1px solid var(--code-border);
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
            direction: ltr;
            text-align: left;
            font-family: 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
            font-size: 0.85em;
            position: relative;
        }

        .message code {
            font-family: inherit;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--surface2);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.7em;
            z-index: 2;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: var(--accent);
            color: white;
        }

        /* ===== منطقة الإدخال ===== */
        .input-area {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 15px 20px;
            display: flex;
            gap: 10px;
        }

        .input-area textarea {
            flex: 1;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 1em;
            resize: none;
            max-height: 150px;
            min-height: 40px;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .input-area button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .input-area button:hover {
            opacity: 0.9;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== مؤشر الكتابة ===== */
        .typing-indicator {
            align-self: flex-start;
            background: var(--assistant-bubble);
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            gap: 4px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* ===== استجابة ===== */
        @media (max-width: 600px) {
            .message { max-width: 95%; }
            .input-area { flex-direction: column; }
            .input-area button { padding: 12px; }
            .crystal-logo { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <!-- الشعار -->
    <div class="logo-container">
        <div class="crystal-logo"></div>
    </div>

    <!-- الترويسة -->
    <div class="header">
        <div>
            <div class="title">{{ ai_name }} للذكاء والبرمجة</div>
            <div class="subtitle">المطور: {{ developer_name }}</div>
        </div>
        <div class="actions">
            <button class="btn-clear" onclick="clearChat()">🗑️ مسح المحادثة</button>
        </div>
    </div>

    <!-- منطقة المحادثة -->
    <div class="chat-container" id="chatContainer"></div>

    <!-- منطقة الإدخال -->
    <div class="input-area">
        <textarea id="userInput" placeholder="اكتب سؤالك أو طلبك هنا..." rows="1"></textarea>
        <button id="sendBtn" onclick="sendMessage()">إرسال</button>
    </div>

    <script>
        // ===== التهيئة =====
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const STORAGE_KEY = 'khallaqi_chat_history';

        // تحميل المحادثة من localStorage عند فتح الصفحة
        function loadConversation() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const messages = JSON.parse(saved);
                    messages.forEach(msg => {
                        addMessage(msg.content, msg.sender, false);
                    });
                } catch (e) {
                    console.error('فشل تحميل المحادثة:', e);
                }
            } else {
                addMessage('مرحباً! أنا الخلاقي، مهندسك البرمجي. كيف يمكنني مساعدتك؟', 'assistant', false);
            }
        }

        // حفظ المحادثة إلى localStorage
        function saveConversation() {
            const messages = [];
            const messageDivs = chatContainer.querySelectorAll('.message');
            messageDivs.forEach(div => {
                const sender = div.classList.contains('user') ? 'user' : 'assistant';
                const content = div.querySelector('.content')?.innerText || '';
                messages.push({ sender, content });
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        }

        // إضافة رسالة إلى واجهة الدردشة
        function addMessage(content, sender, save = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const senderLabel = document.createElement('div');
            senderLabel.className = 'sender';
            senderLabel.textContent = sender === 'user' ? 'أنت:' : 'الخلاقي:';
            messageDiv.appendChild(senderLabel);

            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';

            if (content.includes('```')) {
                const parts = content.split('```');
                for (let i = 0; i < parts.length; i++) {
                    if (i % 2 === 0) {
                        const textPart = document.createElement('div');
                        textPart.innerHTML = formatText(parts[i]);
                        contentDiv.appendChild(textPart);
                    } else {
                        const pre = document.createElement('pre');
                        const code = document.createElement('code');
                        code.textContent = parts[i].replace(/^\w+\n/, '');
                        pre.appendChild(code);

                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'copy-btn';
                        copyBtn.textContent = 'نسخ';
                        copyBtn.onclick = function() {
                            navigator.clipboard.writeText(code.textContent).then(() => {
                                copyBtn.textContent = 'تم النسخ!';
                                setTimeout(() => { copyBtn.textContent = 'نسخ'; }, 2000);
                            });
                        };
                        pre.appendChild(copyBtn);
                        contentDiv.appendChild(pre);
                    }
                }
            } else {
                contentDiv.innerHTML = formatText(content);
            }

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (save) saveConversation();
            return messageDiv;
        }

        function formatText(text) {
            let formatted = text.replace(/\n/g, '<br>');
            formatted = formatted.replace(/`([^`]+)`/g, '<code style="background:#0d0d14;padding:2px 5px;border-radius:4px;">$1</code>');
            formatted = formatted.replace(/^### (.*)$/gm, '<strong>$1</strong>');
            formatted = formatted.replace(/^## (.*)$/gm, '<strong style="font-size:1.2em;">$1</strong>');
            formatted = formatted.replace(/^# (.*)$/gm, '<strong style="font-size:1.4em;">$1</strong>');
            return formatted;
        }

        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            chatContainer.appendChild(indicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;

            showTypingIndicator();

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                const data = await response.json();
                hideTypingIndicator();

                if (!response.ok) {
                    addMessage(data.error || 'حدث خطأ غير معروف', 'assistant');
                } else {
                    addMessage(data.response, 'assistant');
                }
            } catch (error) {
                hideTypingIndicator();
                addMessage('❌ فشل الاتصال بالخادم: ' + error.message, 'assistant');
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function clearChat() {
            if (!confirm('هل تريد مسح المحادثة نهائياً؟')) return;

            try {
                await fetch('/clear', { method: 'POST' });
            } catch (e) {
                console.error('فشل مسح المحادثة على الخادم:', e);
            }

            localStorage.removeItem(STORAGE_KEY);
            chatContainer.innerHTML = '';
            addMessage('تم مسح المحادثة. كيف يمكنني مساعدتك؟', 'assistant', false);
        }

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        loadConversation();
    </script>
</body>
</html>
