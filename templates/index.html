<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ ai_name }}</title>
<style>
:root{--bg:#0a0e1a;--surface:#131826;--surface2:#1a2138;--sidebar:#0f1420;--text:#e5e9f0;--muted:#8b95a9;--accent:#a855f7;--accent2:#7c3aed;--success:#10b981;--danger:#ef4444;--border:#1f2937;--code:#0d1117}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden}

.sidebar{width:280px;background:var(--sidebar);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s;z-index:10}
.sb-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sb-header h2{font-size:1rem;color:var(--accent)}
.sb-header .sub{font-size:.68rem;color:var(--muted);margin-top:2px}
.new-chat-btn{margin:12px;padding:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:bold;font-family:inherit;font-size:.9rem}
.new-chat-btn:hover{opacity:.9}
.chats-list{flex:1;overflow-y:auto;padding:0 8px 8px}
.chat-item{padding:10px 12px;background:transparent;color:var(--text);border:1px solid transparent;border-radius:8px;cursor:pointer;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-size:.85rem;width:100%;text-align:right;font-family:inherit}
.chat-item:hover{background:var(--surface2)}
.chat-item.active{background:var(--surface2);border-color:var(--accent)}
.chat-item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:8px}
.chat-item .del{padding:3px 6px;border-radius:4px;font-size:.75rem;color:var(--muted);background:transparent;border:none;cursor:pointer}
.chat-item .del:hover{background:var(--danger);color:#fff}
.sb-footer{padding:10px;border-top:1px solid var(--border);display:flex;gap:6px}
.sb-footer button{flex:1;padding:10px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.8rem;font-family:inherit}
.sb-footer button:hover{background:var(--accent);color:#fff}

.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{background:var(--surface);padding:12px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}
.hl{display:flex;align-items:center;gap:12px}
.menu-btn{display:none;background:transparent;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:1.1rem}
.header h1{font-size:1.1rem;color:var(--accent)}
.header .sub{font-size:.72rem;color:var(--muted)}
.badge{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:.7rem;color:var(--muted)}
.dot-live{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)}

.quick-bar{padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick-bar::-webkit-scrollbar{display:none}
.quick-bar button{padding:6px 12px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:14px;cursor:pointer;font-size:.75rem;font-family:inherit;white-space:nowrap}
.quick-bar button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.msg{max-width:85%;padding:12px 16px;border-radius:12px;line-height:1.65;word-wrap:break-word}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-left-radius:3px}
.msg.bot{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-right-radius:3px}
.msg.error{align-self:center;background:rgba(239,68,68,.15);border:1px solid var(--danger);color:#fca5a5;font-size:.85rem;text-align:center;max-width:90%;padding:10px 16px;border-radius:8px}
.msg.info{align-self:center;background:rgba(59,130,246,.15);border:1px solid #3b82f6;color:#93c5fd;font-size:.8rem;text-align:center;padding:8px 14px;border-radius:8px}
.sender{font-weight:bold;font-size:.72rem;opacity:.75;margin-bottom:4px}
.content{white-space:pre-wrap}
pre{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:12px;padding-top:34px;margin:8px 0;overflow-x:auto;direction:ltr;text-align:left;font-family:'Cascadia Code','Fira Code',monospace;font-size:.82rem;position:relative;white-space:pre}
.inline-code{background:var(--code);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-family:monospace;font-size:.85em}
.copy-btn{position:absolute;top:6px;right:6px;background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:4px 10px;cursor:pointer;font-size:.7rem;font-family:inherit}
.copy-btn:hover{background:var(--accent);color:#fff}
.copy-btn.done{background:var(--success);color:#fff;border-color:var(--success)}
.source-badge{font-size:.65rem;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--border);opacity:.7}

.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:40px 20px}
.empty h2{color:var(--accent);font-size:1.5rem}
.empty p{color:var(--muted);max-width:500px;line-height:1.7}
.empty .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.empty .chips button{padding:10px 16px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-family:inherit;font-size:.85rem}
.empty .chips button:hover{background:var(--accent);color:#fff}

.input-area{background:var(--surface);padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:.95rem;resize:none;max-height:140px;min-height:44px;line-height:1.5}
textarea:focus{outline:none;border-color:var(--accent)}
.send-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 22px;height:44px;cursor:pointer;font-weight:bold;font-family:inherit}
.send-btn:hover:not(:disabled){opacity:.9}
.send-btn:disabled{opacity:.4;cursor:not-allowed;background:var(--surface2);color:var(--muted)}

.typing{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);padding:12px 18px;border-radius:12px;display:flex;gap:5px}
.typing span{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:typing 1.3s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-7px);opacity:1}}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9}
@media (max-width:768px){
.sidebar{position:fixed;right:0;top:0;bottom:0;transform:translateX(100%)}
.sidebar.open{transform:translateX(0)}
.menu-btn{display:block}
.overlay.show{display:block}
.msg{max-width:95%}
.input-area{padding:10px}
}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="sb-header">
        <div>
            <h2>⚡ {{ ai_name }}</h2>
            <div class="sub">{{ developer_name }}</div>
        </div>
        <button style="background:transparent;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer" onclick="toggleSidebar()">✖</button>
    </div>
    <button class="new-chat-btn" onclick="newChat()">➕ محادثة جديدة</button>
    <div class="chats-list" id="chatsList"></div>
    <div class="sb-footer">
        <button onclick="testConnection()">🔌 اختبار الاتصال</button>
    </div>
</aside>
<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<div class="main">
    <header class="header">
        <div class="hl">
            <button class="menu-btn" onclick="toggleSidebar()">☰</button>
            <div>
                <h1>{{ ai_name }}</h1>
                <div class="sub">مساعد برمجي - {{ developer_name }}</div>
            </div>
        </div>
        <div class="badge"><span class="dot-live"></span><span id="activeProvider">جاهز</span></div>
    </header>

    <div class="quick-bar">
        <button onclick="quickPrompt('اكتب لعبة ثعبان Python كود كامل')">🐍 لعبة ثعبان</button>
        <button onclick="quickPrompt('اكتب موقع HTML CSS JS كامل')">🌐 موقع</button>
        <button onclick="quickPrompt('اكتب بوت تيليجرام Python كود كامل')">🤖 بوت تيليجرام</button>
        <button onclick="quickPrompt('اكتب آلة حاسبة Python Tkinter كود كامل')">🧮 آلة حاسبة</button>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
        <textarea id="input" placeholder="اطلب أي كود..." rows="1"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMsg()">إرسال</button>
    </div>
</div>

<script>
// ═══ Constants ═══
let USER_ID = localStorage.getItem('khallaqi_user_id');
if (!USER_ID) {
    USER_ID = 'u_' + Math.random().toString(36).slice(2) + Date.now();
    localStorage.setItem('khallaqi_user_id', USER_ID);
}
let currentChatId = null;
let chats = [];
let isSending = false;

const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');

console.log('[INIT] USER_ID =', USER_ID);

// ═══ UI helpers ═══
function toggleSidebar() {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
}

function showError(text) {
    if (chatEl.querySelector('.empty')) chatEl.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'msg error';
    d.textContent = text;
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
}

function showInfo(text) {
    const d = document.createElement('div');
    d.className = 'msg info';
    d.textContent = text;
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
}

// ═══ API helper - يعرض كل الأخطاء بوضوح ═══
async function api(url, options = {}) {
    console.log('[API]', options.method || 'GET', url);
    try {
        const r = await fetch(url, options);
        const raw = await r.text();
        console.log('[API] Response status:', r.status, 'body:', raw.substring(0, 200));
        let data;
        try {
            data = JSON.parse(raw);
        } catch (e) {
            console.error('[API] JSON parse error:', e, 'raw:', raw.substring(0, 300));
            throw new Error('السيرفر أرجع رداً غير متوقع (قد يكون السيرفر متوقفاً أو هناك خطأ داخلي)');
        }
        if (!r.ok && !data.error) {
            throw new Error('HTTP ' + r.status + ' - ' + (data.message || 'خطأ غير معروف'));
        }
        return data;
    } catch (e) {
        console.error('[API] Fetch failed:', e);
        if (e.name === 'TypeError' && e.message.includes('fetch')) {
            throw new Error('تعذّر الاتصال بالسيرفر. قد يكون متوقفاً أو بطيئاً — أعد المحاولة بعد 30 ثانية.');
        }
        throw e;
    }
}

// ═══ Chats ═══
async function loadChats() {
    try {
        const d = await api('/chats?user_id=' + encodeURIComponent(USER_ID));
        chats = d.chats || [];
        renderChats();
        console.log('[CHATS] loaded:', chats.length);
    } catch (e) {
        console.error('[CHATS] loadChats failed:', e);
    }
}

function renderChats() {
    const list = document.getElementById('chatsList');
    if (chats.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:.8rem;padding:20px;">لا توجد محادثات</div>';
        return;
    }
    list.innerHTML = '';
    chats.forEach(c => {
        const btn = document.createElement('div');
        btn.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
        const t = document.createElement('span');
        t.className = 'title';
        t.textContent = '💬 ' + (c.title || 'محادثة');
        btn.appendChild(t);
        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '🗑️';
        del.onclick = (e) => { e.stopPropagation(); deleteChat(c.id); };
        btn.appendChild(del);
        btn.onclick = (e) => {
            if (e.target.classList.contains('del')) return;
            openChat(c.id);
        };
        list.appendChild(btn);
    });
}

async function newChat() {
    console.log('[CHAT] newChat called');
    try {
        const d = await api('/chats', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: USER_ID})
        });
        if (!d.chat_id) {
            showError('❌ فشل إنشاء محادثة: ' + (d.error || 'رد غير متوقع'));
            return;
        }
        currentChatId = d.chat_id;
        console.log('[CHAT] created:', currentChatId);
        await loadChats();
        showEmptyChat();
        if (window.innerWidth <= 768) toggleSidebar();
    } catch (e) {
        showError('❌ فشل إنشاء محادثة: ' + e.message);
    }
}

async function openChat(chatId) {
    console.log('[CHAT] opening:', chatId);
    currentChatId = chatId;
    await loadChats();
    chatEl.innerHTML = '';
    try {
        const d = await api(`/chats/${chatId}/messages?user_id=` + encodeURIComponent(USER_ID));
        if (d.messages && d.messages.length > 0) {
            d.messages.forEach(m => addMsg(m.content, m.role === 'user' ? 'user' : 'bot', null, false));
        } else {
            showEmptyChat();
        }
    } catch (e) {
        showError('❌ فشل تحميل الرسائل: ' + e.message);
    }
    if (window.innerWidth <= 768) toggleSidebar();
}

async function deleteChat(chatId) {
    if (!confirm('حذف هذه المحادثة؟')) return;
    try {
        await api('/chats/' + chatId, {
            method: 'DELETE',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({user_id: USER_ID})
        });
        if (currentChatId === chatId) {
            currentChatId = null;
            showEmptyChat();
        }
        await loadChats();
    } catch (e) {
        showError('❌ فشل الحذف: ' + e.message);
    }
}

// ═══ Display ═══
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function showEmptyChat() {
    chatEl.innerHTML = `
        <div class="empty">
            <h2>⚡ ${escapeHtml('{{ ai_name }}')}</h2>
            <p>اطلب أي كود برمجي بأي لغة. سأكتبه كاملاً مع الشرح.</p>
            <div class="chips">
                <button onclick="quickPrompt('اكتب لعبة ثعبان Python كود كامل')">🐍 لعبة ثعبان</button>
                <button onclick="quickPrompt('اكتب موقع شخصي HTML CSS كامل')">🌐 موقع</button>
                <button onclick="quickPrompt('اكتب بوت تيليجرام Python كامل')">🤖 بوت تيليجرام</button>
                <button onclick="quickPrompt('اكتب آلة حاسبة Tkinter كود كامل')">🧮 آلة حاسبة</button>
            </div>
        </div>`;
}

function addMsg(text, who, source, save = true) {
    if (chatEl.querySelector('.empty')) chatEl.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    if (who !== 'error' && who !== 'info') {
        const s = document.createElement('div');
        s.className = 'sender';
        s.textContent = who === 'user' ? 'أنت:' : 'الخلاقي:';
        div.appendChild(s);
    }
    const content = document.createElement('div');
    content.className = 'content';

    if (who === 'error' || who === 'info') {
        content.textContent = text;
    } else {
        const parts = text.split('```');
        for (let i = 0; i < parts.length; i++) {
            if (i % 2 === 0) {
                const span = document.createElement('span');
                const subParts = parts[i].split('`');
                subParts.forEach((sp, j) => {
                    if (j % 2 === 0) span.appendChild(document.createTextNode(sp));
                    else {
                        const c = document.createElement('span');
                        c.className = 'inline-code';
                        c.textContent = sp;
                        span.appendChild(c);
                    }
                });
                content.appendChild(span);
            } else {
                const pre = document.createElement('pre');
                const codeText = parts[i].replace(/^[a-zA-Z0-9_+\-#]*\n/, '');
                const cn = document.createElement('code');
                cn.textContent = codeText;
                pre.appendChild(cn);
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'نسخ';
                btn.onclick = () => {
                    navigator.clipboard.writeText(codeText).then(() => {
                        btn.textContent = '✓ تم';
                        btn.classList.add('done');
                        setTimeout(() => { btn.textContent = 'نسخ'; btn.classList.remove('done'); }, 1800);
                    });
                };
                pre.appendChild(btn);
                content.appendChild(pre);
            }
        }
    }

    div.appendChild(content);
    if (source && who === 'bot') {
        const sb = document.createElement('div');
        sb.className = 'source-badge';
        sb.textContent = '📡 ' + source;
        div.appendChild(sb);
    }
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
}

function quickPrompt(text) {
    inputEl.value = text;
    inputEl.focus();
    autoResize();
}

function showTyping() {
    const d = document.createElement('div');
    d.className = 'typing';
    d.id = 'typingIndicator';
    d.innerHTML = '<span></span><span></span><span></span>';
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
}
function hideTyping() { const e = document.getElementById('typingIndicator'); if (e) e.remove(); }

// ═══ SEND - النسخة المحسّنة ═══
async function sendMsg() {
    if (isSending) {
        console.log('[SEND] already sending, ignored');
        return;
    }
    const text = inputEl.value.trim();
    if (!text) {
        console.log('[SEND] empty text');
        return;
    }

    console.log('[SEND] start, text length:', text.length, 'currentChatId:', currentChatId);

    // إن لم يكن هناك محادثة، أنشئ واحدة أولاً
    if (!currentChatId) {
        showInfo('⏳ جاري إنشاء محادثة جديدة...');
        try {
            const d = await api('/chats', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user_id: USER_ID})
            });
            if (!d.chat_id) {
                showError('❌ تعذّر إنشاء محادثة: ' + (d.error || 'رد غير متوقع'));
                return;
            }
            currentChatId = d.chat_id;
            chatEl.innerHTML = '';
            await loadChats();
        } catch (e) {
            showError('❌ تعذّر إنشاء محادثة: ' + e.message);
            return;
        }
    }

    isSending = true;
    addMsg(text, 'user');
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    sendBtn.textContent = '...';
    showTyping();
    document.getElementById('activeProvider').textContent = 'يفكر...';

    try {
        const data = await api('/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                message: text,
                chat_id: currentChatId,
                user_id: USER_ID
            })
        });

        hideTyping();

        if (data.response) {
            addMsg(data.response, 'bot', data.source);
            document.getElementById('activeProvider').textContent = data.source || 'جاهز';
            loadChats();
        } else if (data.error) {
            showError('❌ ' + data.error);
            document.getElementById('activeProvider').textContent = 'فشل';
        } else {
            showError('❌ رد فارغ من السيرفر');
        }
    } catch (e) {
        hideTyping();
        showError('❌ ' + e.message);
        document.getElementById('activeProvider').textContent = 'خطأ';
    } finally {
        isSending = false;
        sendBtn.disabled = false;
        sendBtn.textContent = 'إرسال';
        inputEl.focus();
    }
}

function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
}
inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});

// ═══ اختبار الاتصال ═══
async function testConnection() {
    chatEl.innerHTML = '';
    showInfo('⏳ جاري اختبار الاتصال بالسيرفر...');
    try {
        const r = await fetch('/status');
        const d = await r.json();
        chatEl.innerHTML = '';
        showInfo('✅ السيرفر يعمل');
        const p = d.providers || {};
        let msg = 'المزودون المتاحون:\n';
        msg += '• Groq: ' + (p.groq ? '✅' : '❌') + '\n';
        msg += '• Cloudflare: ' + (p.cloudflare ? '✅' : '❌') + '\n';
        msg += '• Gemini: ' + (p.gemini ? '✅' : '❌') + '\n';
        msg += '• OpenRouter: ' + (p.openrouter ? '✅' : '❌');
        showInfo(msg);
        if (!p.groq && !p.cloudflare && !p.gemini && !p.openrouter) {
            showError('❌ لا يوجد أي مفتاح API مضاف! اذهب إلى Render > Environment وأضف واحداً على الأقل.');
        }
    } catch (e) {
        chatEl.innerHTML = '';
        showError('❌ فشل الاتصال: ' + e.message);
    }
}

// ═══ Init ═══
window.addEventListener('load', async () => {
    console.log('[INIT] page loaded');
    // اختبار سريع أولاً
    try {
        const r = await fetch('/status');
        const d = await r.json();
        console.log('[INIT] status:', d);
        const p = d.providers || {};
        if (!p.groq && !p.cloudflare && !p.gemini && !p.openrouter) {
            showError('❌ لا يوجد أي مفتاح API. اذهب إلى Render وأضف GROQ_API_KEY على الأقل.');
            return;
        }
    } catch (e) {
        showError('❌ فشل الاتصال بالسيرفر. تحقق من أن التطبيق يعمل على Render.');
        return;
    }

    await loadChats();
    if (chats.length > 0) {
        await openChat(chats[0].id);
    } else {
        await newChat();
    }
});
</script>
</body>
</html>
